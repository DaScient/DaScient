<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DaScient — Single-Pane Glass. A focused interface for biological computing and agentic systems work."
    />
    <title>DaScient // Single-Pane Glass</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind via CDN Play (No-Framework directive). -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Tailwind theme — Single-Pane Glass palette.
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              obsidian: '#050505',
              'obsidian-2': '#0a0a0c',
              'obsidian-3': '#101015',
              gold: '#FAD02C',
              'gold-mute': '#b89a1f',
              concrete: '#E0E0E0',
              'concrete-mute': '#8a8a8a',
            },
            fontFamily: {
              prose: ['Cormorant Garamond', 'serif'],
              sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
            },
          },
        },
      };
    </script>

    <style>
      :root {
        --obsidian: #050505;
        --obsidian-2: #0a0a0c;
        --gold: #fad02c;
        --concrete: #e0e0e0;
        --hairline: rgba(224, 224, 224, 0.08);
        --hairline-strong: rgba(224, 224, 224, 0.16);
      }

      html,
      body {
        height: 100%;
        overflow: hidden; /* Single-Pane: non-scrolling viewport */
        background: var(--obsidian);
        color: var(--concrete);
        font-family: 'Inter', sans-serif;
        font-weight: 300;
        letter-spacing: 0.01em;
        -webkit-font-smoothing: antialiased;
      }

      /* Glass surface: obsidian glassmorphism */
      .glass {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.025) 0%,
          rgba(255, 255, 255, 0.005) 100%
        );
        backdrop-filter: blur(14px) saturate(120%);
        -webkit-backdrop-filter: blur(14px) saturate(120%);
        border: 1px solid var(--hairline);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.04) inset,
          0 24px 60px rgba(0, 0, 0, 0.55);
      }

      .hairline {
        border-color: var(--hairline);
      }
      .hairline-strong {
        border-color: var(--hairline-strong);
      }

      /* Mono telemetry */
      .mono {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 400;
        letter-spacing: 0.02em;
      }

      /* High-contrast prose serif */
      .prose-display {
        font-family: 'Cormorant Garamond', serif;
        font-weight: 500;
        letter-spacing: -0.005em;
      }

      /* Gold accent rule (used minimally) */
      .gold-rule {
        background: linear-gradient(
          90deg,
          transparent 0%,
          var(--gold) 20%,
          var(--gold) 80%,
          transparent 100%
        );
        height: 1px;
        opacity: 0.5;
      }

      /* Caret for terminal */
      .caret::after {
        content: '▍';
        margin-left: 2px;
        color: var(--gold);
        animation: blink 1.05s steps(2, start) infinite;
      }
      @keyframes blink {
        50% { opacity: 0; }
      }

      /* Module morph: blur-and-reveal */
      .stage {
        transition:
          opacity 380ms ease,
          filter 380ms ease,
          transform 380ms ease;
      }
      .stage.hiding {
        opacity: 0;
        filter: blur(14px);
        transform: scale(0.985);
        pointer-events: none;
      }

      /* Status pulse */
      .pulse-dot {
        width: 6px;
        height: 6px;
        border-radius: 9999px;
        background: var(--gold);
        box-shadow: 0 0 0 0 rgba(250, 208, 44, 0.6);
        animation: pulse 2.4s ease-out infinite;
      }
      @keyframes pulse {
        0%   { box-shadow: 0 0 0 0 rgba(250, 208, 44, 0.55); }
        70%  { box-shadow: 0 0 0 10px rgba(250, 208, 44, 0); }
        100% { box-shadow: 0 0 0 0 rgba(250, 208, 44, 0); }
      }

      /* Scrollbar in panels */
      .panel-scroll {
        scrollbar-width: thin;
        scrollbar-color: rgba(224, 224, 224, 0.18) transparent;
      }
      .panel-scroll::-webkit-scrollbar {
        width: 6px;
      }
      .panel-scroll::-webkit-scrollbar-thumb {
        background: rgba(224, 224, 224, 0.14);
        border-radius: 3px;
      }

      /* Selectable command line */
      .cmd-input {
        background: transparent;
        border: none;
        outline: none;
        width: 100%;
        color: var(--concrete);
        font-family: 'JetBrains Mono', monospace;
        caret-color: var(--gold);
      }

      /* Book — minimalist 3D asset */
      .book {
        position: relative;
        width: 110px;
        height: 160px;
        transform-style: preserve-3d;
        transform: rotateY(-22deg) rotateX(4deg);
        transition: transform 420ms ease;
      }
      .book:hover {
        transform: rotateY(-8deg) rotateX(2deg) translateY(-4px);
      }
      .book .face {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(0, 0, 0, 0.4)),
          linear-gradient(135deg, #1a1a1f 0%, #08080a 100%);
        border: 1px solid var(--hairline-strong);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.03),
          0 14px 32px rgba(0, 0, 0, 0.6);
      }
      .book .spine {
        position: absolute;
        left: -10px;
        top: 0;
        bottom: 0;
        width: 10px;
        transform: rotateY(90deg) translateZ(5px);
        background: linear-gradient(180deg, #14141a, #050505);
        border-left: 1px solid var(--hairline);
      }
      .book .pages {
        position: absolute;
        right: -4px;
        top: 4px;
        bottom: 4px;
        width: 4px;
        background: repeating-linear-gradient(
          180deg,
          rgba(224, 224, 224, 0.08) 0 1px,
          transparent 1px 2px
        );
      }
      .book .gold-mark {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 18px;
        height: 1px;
        background: var(--gold);
        opacity: 0.55;
      }
      .book .title-line {
        position: absolute;
        left: 16px;
        right: 16px;
        top: 22px;
        font-family: 'Cormorant Garamond', serif;
        font-size: 13px;
        line-height: 1.15;
        color: var(--concrete);
      }
      .book .sub-line {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 28px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 8px;
        letter-spacing: 0.18em;
        color: var(--gold);
        text-transform: uppercase;
      }

      /* Neural pathway canvas covers viewport behind the HUD */
      #neural {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
      }

      /* Subtle vignette */
      .vignette::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse at center,
          transparent 50%,
          rgba(0, 0, 0, 0.55) 100%
        );
        z-index: 1;
      }

      /* Boot fade */
      #boot {
        transition: opacity 600ms ease;
      }
      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }

      /* Default (desktop) HUD grid template */
      .hud-grid {
        grid-template-columns: 240px 1fr 280px;
        grid-template-rows: 56px 1fr 44px;
      }

      /* Viewport guard for tiny screens — let it scroll instead of crushing */
      @media (max-height: 640px), (max-width: 720px) {
        html, body { overflow: auto; }
      }

      /* ---------- Low-end mobile / narrow viewport optimizations ---------- */
      @media (max-width: 768px) {
        /* Stack the HUD vertically. Center workspace appears first; rails follow. */
        .hud-grid {
          grid-template-columns: 1fr !important;
          grid-template-rows: auto !important;
          height: auto !important;
        }
        .hud-grid > * {
          grid-row: auto !important;
          grid-column: auto !important;
        }
        /* Order: top bar → workspace → intents → log → footer */
        .hud-grid > header { order: 0; min-height: 48px; padding-left: 14px; padding-right: 14px; }
        .hud-grid > main   { order: 1; min-height: 60vh; }
        .hud-grid > #intent-rail { order: 2; }
        .hud-grid > #log-rail    { order: 3; }
        .hud-grid > footer { order: 4; min-height: 40px; padding-left: 14px; padding-right: 14px; flex-wrap: wrap; gap: 6px; }

        /* Tighten typography & paddings on small screens */
        .hud-grid > main #stage { padding: 18px !important; }
        .hud-grid > aside { padding: 12px; }
        .prose-display { letter-spacing: 0; }
        .mono { letter-spacing: 0.04em; }

        /* The inline neural background is decorative; keep it but make it cheaper */
        #neural { opacity: 0.55; }

        /* Backdrop-filter blur is GPU-expensive on low-end phones — soften it
           and back it with a more opaque surface so contrast still reads. */
        .glass {
          backdrop-filter: blur(6px) saturate(110%);
          -webkit-backdrop-filter: blur(6px) saturate(110%);
          background: linear-gradient(
            135deg,
            rgba(20, 20, 24, 0.55) 0%,
            rgba(10, 10, 12, 0.55) 100%
          );
        }

        /* The radial vignette adds another full-viewport composited layer for
           little visual benefit at this size — drop it on small screens. */
        .vignette::before { display: none; }

        /* Shorten the stage morph so module swaps don't feel laggy on slow GPUs */
        .stage { transition-duration: 220ms; }
        .stage.hiding { filter: blur(6px); }

        /* Hide the ambient pulse animation outline (cheap but redundant on mobile) */
        .pulse-dot { animation: none; box-shadow: none; }

        /* Make tap targets at least ~36px tall */
        button, .cmd-input { min-height: 36px; }

        /* Ensure inputs render at >=16px so iOS doesn't auto-zoom on focus */
        .cmd-input { font-size: 16px; }
        textarea.cmd-input { font-size: 14px; min-height: 96px; }

        /* Right-rail panels can grow naturally rather than fighting for height */
        #syslog, #arch-thread { max-height: 240px; }

        /* Hide some non-essential chrome to reduce visual noise */
        #hud-clock, #hud-session, #hud-intent { display: none; }
        #hud-version { display: none; }
        #hud-substrate { display: none; }

        /* Library shelf was a wide 3D row — wrap and flatten for narrow screens */
        #lib-shelf { gap: 28px; perspective: none; }
        .book { transform: none; width: 96px; height: 140px; }
        .book:hover { transform: none; }
      }

      /* Honor user preference for reduced motion: no animations, no canvas drift */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
        #neural { display: none; }
      }

      /* ---------- Orchestration Layer surfaces ---------- */

      /* Memory rail pulse — fires on specialist swap */
      .rail-pulse {
        animation: rail-pulse 1.6s ease-out 1;
      }
      @keyframes rail-pulse {
        0%   { box-shadow: 0 0 0 0 rgba(250, 208, 44, 0.45); }
        50%  { box-shadow: 0 0 0 6px rgba(250, 208, 44, 0.18); }
        100% { box-shadow: 0 0 0 0 rgba(250, 208, 44, 0); }
      }

      /* System Log — orchestration levels get their own treatment */
      .log-switch { color: var(--gold); font-weight: 500; }
      .log-mem    { color: #e0e0e0; }
      .log-alert  { color: var(--gold); text-shadow: 0 0 6px rgba(250, 208, 44, 0.35); }

      /* Chat thread bubbles */
      .arch-msg-user {
        background: rgba(250, 208, 44, 0.06);
        border: 1px solid rgba(250, 208, 44, 0.16);
      }
      .arch-msg-spec {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--hairline);
      }

      /* Threshold meter */
      .meter-track {
        background: rgba(224, 224, 224, 0.08);
        height: 2px;
        border-radius: 1px;
        overflow: hidden;
      }
      .meter-fill {
        height: 100%;
        background: linear-gradient(90deg, #b89a1f, #fad02c);
        transition: width 480ms ease;
      }

      /* Conversion overlay */
      .conv-overlay {
        position: absolute;
        inset: 0;
        background: rgba(5, 5, 5, 0.72);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: conv-fade-in 420ms ease;
      }
      @keyframes conv-fade-in {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      .conv-card {
        max-width: 540px;
        width: calc(100% - 48px);
        background: linear-gradient(135deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
        border: 1px solid var(--hairline-strong);
        border-radius: 6px;
        padding: 28px 30px;
        box-shadow: 0 30px 70px rgba(0, 0, 0, 0.7);
      }
    </style>
  </head>

  <body class="vignette">
    <!-- Bio-Digital Link: silent SVG neural pathways -->
    <svg id="neural" aria-hidden="true"></svg>

    <!-- Boot overlay -->
    <div
      id="boot"
      class="fixed inset-0 z-50 flex items-center justify-center bg-obsidian"
    >
      <div class="text-center">
        <div class="mono text-[11px] tracking-[0.32em] text-concrete-mute">
          DASCIENT // SINGLE-PANE GLASS
        </div>
        <div class="gold-rule mt-3 mx-auto" style="width: 220px"></div>
        <div id="boot-line" class="mono text-xs text-concrete mt-6 h-4"></div>
      </div>
    </div>

    <!-- HUD -->
    <div class="relative z-10 h-screen w-screen p-4 md:p-5">
      <div class="hud-grid grid h-full w-full gap-3 md:gap-4">
        <!-- Top bar (spans all columns) -->
        <header
          class="glass col-span-3 flex items-center justify-between px-5 rounded"
          style="grid-row: 1"
        >
          <div class="flex items-center gap-3">
            <div class="pulse-dot"></div>
            <div class="mono text-[11px] tracking-[0.28em] text-concrete">
              DASCIENT
            </div>
            <div id="hud-version" class="hidden md:block mono text-[10px] tracking-[0.24em] text-concrete-mute">
              · SINGLE-PANE GLASS · v1.0
            </div>
          </div>
          <div class="hidden md:flex items-center gap-6 mono text-[10px] tracking-[0.22em] text-concrete-mute">
            <span id="hud-clock">--:--:--&nbsp;UTC</span>
            <span>SESSION&nbsp;<span id="hud-session" class="text-concrete">—</span></span>
            <span>INTENT&nbsp;<span id="hud-intent" class="text-gold">IDLE</span></span>
          </div>
        </header>

        <!-- Left rail: Intent selector -->
        <aside
          id="intent-rail"
          class="glass rounded p-4 flex flex-col"
          style="grid-row: 2"
        >
          <div class="mono text-[10px] tracking-[0.24em] text-concrete-mute mb-3">
            INTENTS
          </div>
          <nav id="intent-list" class="flex flex-col gap-1 flex-1 panel-scroll overflow-y-auto"></nav>
          <div class="gold-rule my-3"></div>
          <div class="mono text-[10px] tracking-[0.22em] text-concrete-mute leading-relaxed">
            No links. Only<br />executing commands.
          </div>
        </aside>

        <!-- Center workspace -->
        <main
          class="glass rounded relative overflow-hidden"
          style="grid-row: 2"
        >
          <div id="stage" class="stage absolute inset-0 p-8 md:p-10 flex flex-col overflow-y-auto panel-scroll"></div>
        </main>

        <!-- Right rail: System Log + Session Memory -->
        <aside
          id="log-rail"
          class="glass rounded p-4 flex flex-col gap-3"
          style="grid-row: 2"
        >
          <div class="flex items-center justify-between">
            <div class="mono text-[10px] tracking-[0.24em] text-concrete-mute">
              SYSTEM LOG
            </div>
            <div class="mono text-[9px] tracking-[0.22em] text-gold">LIVE</div>
          </div>
          <div
            id="syslog"
            class="mono text-[10px] leading-relaxed text-concrete-mute flex-1 overflow-y-auto panel-scroll pr-1"
          ></div>
          <div class="gold-rule"></div>
          <div>
            <div class="mono text-[10px] tracking-[0.24em] text-concrete-mute mb-2">
              SESSION MEMORY
            </div>
            <div id="memory" class="mono text-[10px] text-concrete leading-relaxed"></div>
          </div>
        </aside>

        <!-- Bottom bar -->
        <footer
          class="glass col-span-3 flex items-center justify-between px-5 rounded"
          style="grid-row: 3"
        >
          <div class="prose-display italic text-[15px] text-concrete">
            We engineer resilient systems.
          </div>
          <div id="hud-substrate" class="mono text-[10px] tracking-[0.22em] text-concrete-mute">
            BIO-DIGITAL · AGENTIC · DETERMINISTIC
          </div>
        </footer>
      </div>
    </div>

    <!-- ================================================================== -->
    <!-- Single-Pane Engine (Vanilla JS, manifest-driven, state-driven UI). -->
    <!-- ================================================================== -->
    <script>
      'use strict';

      // ---------- Utilities ----------
      const qs = (s, r = document) => r.querySelector(s);
      const ce = (t, c) => {
        const e = document.createElement(t);
        if (c) e.className = c;
        return e;
      };
      const escapeHtml = (s) =>
        String(s).replace(/[&<>"']/g, (m) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;',
        }[m]));

      // ---------- State ----------
      const STORE_KEY = 'dascient.session.v1';
      // Build-time injected OpenAI API key. The literal token below is
      // replaced by Vite's `transformIndexHtml` hook (see vite.config.js)
      // with the value of the OPENAI_API_KEY environment variable at build
      // time. When the env var is unset the placeholder becomes an empty
      // string and the OpenAI fallback stays disabled.
      //
      // SECURITY CAVEAT: this value ships in the public static bundle and is
      // readable by anyone who loads the deployed site. Only use a key that
      // is origin-restricted and rate-limited at the OpenAI dashboard.
      const OPENAI_API_KEY = '__OPENAI_API_KEY__';
      const OPENAI_MODEL = 'gpt-4o-mini';
      const State = {
        manifest: null,
        intent: null,
        sessionId: null,
        // Orchestration runtime — not persisted (engines are reconstructed per session).
        orchestration: {
          currentModel: null,
          currentVector: null,
          progress: 0, // 0..100 — feeds threshold meter / [ALERT] hooks
          handoffShown: false,
          webllm: { engaged: false, engine: null, modelId: null, loading: false },
        },
        memory: {
          events: [],
          lastIntent: null,
          bookings: [],
          // Persisted dialogue state (so VECTOR_C interview survives refresh).
          dialogue: { vector: null, history: [], recruitment: { answers: [], step: 0, completed: false } },
        },
      };

      function loadMemory() {
        try {
          const raw = localStorage.getItem(STORE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            // Shallow merge top-level, then re-hydrate nested dialogue block defensively
            // so older persisted shapes (without dialogue) don't break orchestration.
            State.memory = { ...State.memory, ...parsed };
            const d = State.memory.dialogue || {};
            const r = d.recruitment || {};
            State.memory.dialogue = {
              vector: d.vector || null,
              history: Array.isArray(d.history) ? d.history : [],
              recruitment: {
                answers: Array.isArray(r.answers) ? r.answers : [],
                step: typeof r.step === 'number' ? r.step : 0,
                completed: !!r.completed,
              },
            };
          }
        } catch (_) {
          /* deterministic ignore */
        }
        if (!State.memory.sessionId) {
          State.memory.sessionId = signedHash('session', Date.now());
        }
        State.sessionId = State.memory.sessionId;
      }
      function persistMemory() {
        try {
          localStorage.setItem(STORE_KEY, JSON.stringify(State.memory));
        } catch (_) {
          /* */
        }
      }

      // Deterministic visual "signed hash" — not a security primitive, a UI flair.
      function signedHash(prefix, seed) {
        const s = String(prefix) + ':' + String(seed);
        let h = 2166136261 >>> 0;
        for (let i = 0; i < s.length; i++) {
          h ^= s.charCodeAt(i);
          h = Math.imul(h, 16777619) >>> 0;
        }
        const hex = ('00000000' + h.toString(16)).slice(-8);
        return hex.toUpperCase();
      }

      // ---------- System Log (Agentic Events) ----------
      const Log = {
        el: null,
        levelClass(level) {
          switch (level) {
            case 'EXEC':   return 'text-gold';
            case 'WARN':   return 'text-gold-mute';
            case 'SWITCH': return 'log-switch';
            case 'MEM':    return 'log-mem';
            case 'ALERT':  return 'log-alert';
            default:       return 'text-concrete';
          }
        },
        push(level, msg) {
          if (!this.el) this.el = qs('#syslog');
          const t = new Date();
          const ts =
            String(t.getUTCHours()).padStart(2, '0') +
            ':' +
            String(t.getUTCMinutes()).padStart(2, '0') +
            ':' +
            String(t.getUTCSeconds()).padStart(2, '0');
          const line = ce('div');
          line.innerHTML =
            '<span class="text-concrete-mute">' +
            ts +
            '</span> ' +
            '<span class="' +
            this.levelClass(level) +
            '">' +
            escapeHtml(level) +
            '</span> ' +
            '<span>' +
            escapeHtml(msg) +
            '</span>';
          this.el.appendChild(line);
          this.el.scrollTop = this.el.scrollHeight;

          State.memory.events.push({ ts: t.toISOString(), level, msg });
          if (State.memory.events.length > 60)
            State.memory.events = State.memory.events.slice(-60);
          persistMemory();
        },
      };

      // ---------- Typewriter ----------
      function typewriter(node, text, speed = 14) {
        return new Promise((resolve) => {
          node.textContent = '';
          node.classList.add('caret');
          let i = 0;
          const step = () => {
            if (i >= text.length) {
              node.classList.remove('caret');
              return resolve();
            }
            node.textContent += text.charAt(i++);
            setTimeout(step, speed);
          };
          step();
        });
      }

      // ---------- HUD chrome ----------
      function tickClock() {
        const el = qs('#hud-clock');
        if (!el) return;
        const t = new Date();
        const fmt = (n) => String(n).padStart(2, '0');
        el.textContent =
          fmt(t.getUTCHours()) +
          ':' +
          fmt(t.getUTCMinutes()) +
          ':' +
          fmt(t.getUTCSeconds()) +
          ' UTC';
      }
      setInterval(tickClock, 1000);
      tickClock();

      // ---------- Stage Morph ----------
      const stage = () => qs('#stage');
      function morph(renderFn) {
        const s = stage();
        s.classList.add('hiding');
        setTimeout(() => {
          s.innerHTML = '';
          renderFn(s);
          // Force a synchronous reflow so the browser commits the new DOM /
          // initial 'hiding' styles before we remove the class — this is what
          // produces the blur-and-reveal transition rather than an instant swap.
          void s.offsetHeight;
          s.classList.remove('hiding');
        }, 380);
      }

      function parseIntent(text) {
        if (!text) return;
        Log.push('PARSE', '"' + text + '"');
        const t = text.toLowerCase();
        const aliases = [
          { id: 'proposal', words: ['proposal', 'grant', 'doe', 'darpa', 'nih', 'craft'] },
          { id: 'booking', words: ['booking', 'book', 'session', 'consult', 'schedule', 'meet'] },
          { id: 'modules', words: ['module', 'artifact', 'repo', 'plan', 'organoid', 'ares'] },
          { id: 'library', words: ['library', 'read', 'doctrine', 'literacy'] },
          { id: 'about', words: ['about', 'who', 'thesis', 'brief'] },
          { id: 'dialogue', words: ['dialogue', 'chat', 'talk', 'agent', 'agentic', 'develop',
                                    'hire', 'join', 'career', 'recruit', 'team', 'orchestrat',
                                    'specialist', 'webllm'] },
        ];
        let match = null;
        for (const a of aliases) {
          if (a.words.some((w) => t.includes(w))) {
            match = a.id;
            break;

        if (!match) {

          flashUnresolved();
          return;

        selectIntent(match);

      // ============================================================
      // Module: Architect Dialogue (Model Orchestration Layer)
      // ============================================================
      // Architectural Hand-off: a Dispatcher (Qwen 2.5-Coder 1.5B in spec)
      // routes user intent into one of three Specialist vectors. Each vector
      // streams a deterministic synthesis (or, if engaged, a real WebLLM
      // engine), tracks a conversion-threshold meter, and pivots to a human
      // hand-off email when its "End of Logic" state is reached.

      const Orchestrator = {
        // Lookup helpers
        vectorById(id) {
          const o = State.manifest && State.manifest.orchestration;
          if (!o) return null;
          return o.vectors.find((v) => v.id === id) || null;
        },

        // Dispatcher: keyword-scored classification. Stand-in for the live
        // Qwen 2.5-Coder router — emits the same telemetry surface so the
        // engine can be swapped underneath without changing the UI contract.
        route(text) {
          const o = State.manifest.orchestration;
          const t = text.toLowerCase();
          let best = { id: null, score: 0 };
          for (const v of o.vectors) {
            let score = 0;
            for (const k of v.keywords) {
              if (t.includes(k)) score += k.length >= 5 ? 2 : 1;
            }
            if (score > best.score) best = { id: v.id, score };
          }
          // Default vector — if router is uncertain, prefer Agentic Development
          // (the broadest specialist surface for unresolved technical intents).
          return best.id || 'B';
        },

        // Setting the active specialist also fires the [SWITCH]/[MEM]
        // telemetry pair and pulses the right-rail.
        setVector(vectorId, opts) {
          opts = opts || {};
          const v = this.vectorById(vectorId);
          if (!v) return;
          if (State.orchestration.currentVector === v.code && !opts.force) return;
          const router = State.manifest.orchestration.router;
          State.orchestration.currentVector = v.code;
          State.orchestration.currentModel = v.model;
          State.orchestration.progress = 0;
          State.orchestration.handoffShown = false;
          State.memory.dialogue.vector = v.id;
          persistMemory();

          Log.push('SWITCH', '-> Intent Detected: ' + v.code +
            '. Loading ' + v.model + ' (' + v.mode + ')...');
          Log.push('MEM', '-> Context transferred to Specialist Engine via ' + router.name + '.');
          pulseMemoryRail();
          renderMemory();
        },

        // Threshold meter — surfaces the [ALERT] hooks from the spec.
        setProgress(pct, ctx) {
          const clamped = Math.max(0, Math.min(100, Math.round(pct)));
          const prev = State.orchestration.progress;
          State.orchestration.progress = clamped;
          const meter = qs('#arch-meter-fill');
          if (meter) meter.style.width = clamped + '%';
          const label = qs('#arch-meter-label');
          if (label) label.textContent = clamped + '%';
          // Cross the 85% line exactly once per vector for the [ALERT] event.
          if (prev < 85 && clamped >= 85) {
            Log.push('ALERT', '-> Conversion Threshold: ' + clamped +
              '% reached. Displaying Human Hand-off...' +
              (ctx ? ' [' + ctx + ']' : ''));
          }
        },
      };

      // ----- Deterministic specialist runners -----
      // Each runner streams in-voice text into the chat thread and returns
      // when its synthesis is complete. If WebLLM is engaged AND a vector's
      // engine is ready, we route to the live model instead.

      function specialistRunA(vector, userText, threadEl) {
        // VECTOR_A — The Strategist. Structural deconstruction + signed hash.
        Orchestrator.setProgress(25, 'parse');
        const id = signedHash('grant', userText);
        const lines = [
          '↳ DECONSTRUCTING SOLICITATION (' + userText.length + ' chars)',
          '↳ MAPPING OUTCOME ONTO PROGRAM AXES',
          '↳ STRESS-TESTING NARRATIVE FOR ADVERSARIAL REVIEW',
          '↳ STRUCTURAL SYNTHESIS COMPLETE · REF ' + id,
        ];
        return streamSpecialistLines(threadEl, vector, lines, [25, 50, 75, 100]);
      }

      function specialistRunB(vector, userText, threadEl) {
        // VECTOR_B — The Senior Architect. Plan-Examiner-aware homebrew guide.
        const t = userText.toLowerCase();
        let block;
        if (t.includes('parse') || t.includes('document') || t.includes('manifest')) {
          block = [
            '↳ HOMEBREW GUIDE · CLIENT-SIDE DOCUMENT PARSING',
            '· Treat the manifest as the ground truth — render UI from it; never the inverse.',
            '· For unstructured inputs: tokenize → segment → project onto a deterministic schema.',
            '· Persist intermediate state in IndexedDB or LocalStorage; keep the network out of the loop.',
          ];
        } else if (t.includes('wasm') || t.includes('webgpu') || t.includes('webllm') || t.includes('inference')) {
          block = [
            '↳ HOMEBREW GUIDE · WASM-BASED INFERENCE',
            '· WebGPU + WebLLM gives you 1.5B–8B-class reasoning entirely on-device.',
            '· Engage Qwen-class routers ahead of heavyweight specialists — keep the dispatcher cheap.',
            '· Cache weights via the browser HTTP cache; first-load is the cost, every subsequent load is free.',
          ];
        } else {
          block = [
            '↳ HOMEBREW GUIDE · AGENTIC WORKFLOW PATTERN',
            '· Decompose: Router → Specialist → Verifier — three roles, three separate model passes.',
            '· Bound the agent by a manifest of allowed actions; emergent agency lives inside that frame.',
            '· Surface every model swap in a System Log — observability is not optional in agentic work.',
          ];
        }
        const cur = State.orchestration.progress || 20;
        const next = Math.min(80, cur + 20);
        return streamSpecialistLines(threadEl, vector, block, [cur + 5, next - 5, next, next + 5]);
      }

      function specialistRunC(vector, userText, threadEl) {
        // VECTOR_C — The Talent Liaison. Records the user's latest answer,
        // then either asks the next interview question or signals completion.
        const r = State.memory.dialogue.recruitment;
        if (!r.completed && r.step < vector.questions.length) {
          // Record the answer to the current question.
          const q = vector.questions[r.step];
          r.answers.push({ id: q.id, label: q.label, answer: userText });
          r.step += 1;
          if (r.step >= vector.questions.length) r.completed = true;
          persistMemory();
        }
        const total = vector.questions.length;
        const pct = Math.round((r.step / total) * 100);
        Orchestrator.setProgress(pct, 'interview ' + r.step + '/' + total);

        if (r.completed) {
          const lines = [
            '↳ INTAKE CAPTURED · ' + total + '/' + total + ' RESPONSES RECORDED',
            '↳ PROVENANCE LOCKED · SIGNED-HASH ' + signedHash('intake', JSON.stringify(r.answers)),
            '↳ INITIATING TEAM HANDOFF',
          ];
          return streamSpecialistLines(threadEl, vector, lines, [pct, pct, 100]);
        }
        const next = vector.questions[r.step];
        const lines = [
          'QUESTION ' + (r.step + 1) + ' / ' + total + ' · ' + next.label,
          next.prompt,
        ];
        return streamSpecialistLines(threadEl, vector, lines, [pct, pct]);
      }

      // Streams text lines into a specialist bubble — the deterministic
      // analogue of a token-by-token LLM stream. Returns a Promise that
      // resolves when the bubble has finished rendering.
      function streamSpecialistLines(threadEl, vector, lines, progressSteps) {
        const bubble = ce('div', 'arch-msg-spec rounded p-4 mt-3');
        bubble.innerHTML =
          '<div class="mono text-[9px] tracking-[0.22em] text-gold-mute">' +
          escapeHtml(vector.model) + ' · ' + escapeHtml(vector.role.toUpperCase()) +
          '</div>' +
          '<div class="mt-2 text-[12.5px] leading-relaxed text-concrete font-mono"></div>';
        threadEl.appendChild(bubble);
        threadEl.scrollTop = threadEl.scrollHeight;
        const target = bubble.querySelector('div:nth-child(2)');
        return new Promise((resolve) => {
          let i = 0;
          const next = () => {
            if (i >= lines.length) return resolve();
            if (progressSteps && typeof progressSteps[i] === 'number') {
              Orchestrator.setProgress(progressSteps[i], vector.code);
            }
            const ln = ce('div');
            ln.textContent = lines[i++];
            target.appendChild(ln);
            threadEl.scrollTop = threadEl.scrollHeight;
            setTimeout(next, 360);
          };
          next();
        });
      }

      // Real WebLLM streaming — used only when the user has explicitly
      // engaged the engine. Falls back gracefully on any error.
      async function specialistRunWebLLM(vector, userText, threadEl) {
        const eng = State.orchestration.webllm.engine;
        if (!eng) return null;
        const bubble = ce('div', 'arch-msg-spec rounded p-4 mt-3');
        bubble.innerHTML =
          '<div class="mono text-[9px] tracking-[0.22em] text-gold-mute">' +
          escapeHtml(vector.model) + ' · ' + escapeHtml(vector.role.toUpperCase()) +
          ' · LIVE' +
          '</div>' +
          '<div class="mt-2 text-[12.5px] leading-relaxed text-concrete"></div>';
        threadEl.appendChild(bubble);
        const target = bubble.querySelector('div:nth-child(2)');
        try {
          Orchestrator.setProgress(40, 'webllm');
          const sys = 'You are ' + vector.role + ' for DaScient (' + vector.label +
            '). Respond with deterministic, high-signal, in-voice prose. ' +
            'Be concise. No preamble. Use mono-style step markers (↳) where appropriate.';
          const messages = [{ role: 'system', content: sys }, { role: 'user', content: userText }];
          const stream = await eng.chat.completions.create({ messages, stream: true });
          let acc = '';
          for await (const chunk of stream) {
            const delta = chunk?.choices?.[0]?.delta?.content || '';
            if (!delta) continue;
            acc += delta;
            target.textContent = acc;
            threadEl.scrollTop = threadEl.scrollHeight;
          }
          Orchestrator.setProgress(95, 'webllm');
          return acc;
        } catch (e) {
          Log.push('WARN', 'WebLLM stream failed — falling back to deterministic');
          bubble.remove();
          return null;
        }
      }

      // OpenAI streaming fallback — used when WebLLM is not engaged and a
      // build-time OpenAI key has been injected. Streams via the chat
      // completions SSE endpoint and renders into a specialist bubble in the
      // same shape as specialistRunWebLLM. Returns the accumulated text on
      // success or null on any failure (so the caller can fall through to
      // the deterministic synthesis).
      async function specialistRunOpenAI(vector, userText, threadEl) {
        if (!OPENAI_API_KEY) return null;
        const bubble = ce('div', 'arch-msg-spec rounded p-4 mt-3');
        bubble.innerHTML =
          '<div class="mono text-[9px] tracking-[0.22em] text-gold-mute">' +
          escapeHtml(vector.model) + ' · ' + escapeHtml(vector.role.toUpperCase()) +
          ' · LIVE · OPENAI' +
          '</div>' +
          '<div class="mt-2 text-[12.5px] leading-relaxed text-concrete"></div>';
        threadEl.appendChild(bubble);
        const target = bubble.querySelector('div:nth-child(2)');
        try {
          Orchestrator.setProgress(40, 'openai');
          const sys = 'You are ' + vector.role + ' for DaScient (' + vector.label +
            '). Respond with deterministic, high-signal, in-voice prose. ' +
            'Be concise. No preamble. Use mono-style step markers (↳) where appropriate.';
          const messages = [{ role: 'system', content: sys }, { role: 'user', content: userText }];
          const resp = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + OPENAI_API_KEY,
            },
            body: JSON.stringify({ model: OPENAI_MODEL, messages, stream: true }),
          });
          if (!resp.ok || !resp.body) {
            throw new Error('openai http ' + resp.status);
          }
          const reader = resp.body.getReader();
          const decoder = new TextDecoder();
          let buf = '';
          let acc = '';
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });
            // SSE: events delimited by blank lines, each line "data: ...".
            let idx;
            while ((idx = buf.indexOf('\n')) >= 0) {
              const line = buf.slice(0, idx).trim();
              buf = buf.slice(idx + 1);
              if (!line.startsWith('data:')) continue;
              const payload = line.slice(5).trim();
              if (payload === '[DONE]') { buf = ''; break; }
              try {
                const json = JSON.parse(payload);
                const delta = json?.choices?.[0]?.delta?.content || '';
                if (delta) {
                  acc += delta;
                  target.textContent = acc;
                  threadEl.scrollTop = threadEl.scrollHeight;
                }
              } catch (_) { /* tolerate partials */ }
            }
          }
          Orchestrator.setProgress(95, 'openai');
          return acc || null;
        } catch (e) {
          Log.push('WARN', 'OpenAI stream failed — falling back to deterministic');
          bubble.remove();
          return null;
        }
      }

      // Threshold evaluator — vector-specific "End of Logic" check.
      function evaluateThreshold(vector, userText) {
        const th = vector.threshold || {};
        if (th.type === 'synthesis_complete') {
          // VECTOR_A — one full structural synthesis is the conversion line.
          return State.orchestration.progress >= 100;
        }
        if (th.type === 'keyword_trigger') {
          const t = (userText || '').toLowerCase();
          return (th.words || []).some((w) => t.includes(w));
        }
        if (th.type === 'interview_complete') {
          return !!(State.memory.dialogue.recruitment.completed);
        }
        return false;
      }

      // ----- WebLLM opt-in engagement -----
      // Loads @mlc-ai/web-llm via esm.run on demand. Honors WebGPU absence
      // with a [WARN] event and stays in deterministic mode.
      async function engageWebLLM(vector, btn) {
        const w = State.orchestration.webllm;
        if (w.loading) return;
        if (!('gpu' in navigator)) {
          Log.push('WARN', 'WebGPU unavailable — staying in deterministic mode');
          if (btn) btn.textContent = '[ WEBGPU UNAVAILABLE ]';
          return;
        }
        w.loading = true;
        if (btn) btn.textContent = '[ LOADING ' + vector.model + ' ]';
        Log.push('MEM', 'engaging WebLLM · ' + vector.engine);
        try {
          const mod = await import('https://esm.run/@mlc-ai/web-llm');
          const engine = await mod.CreateMLCEngine(vector.engine, {
            initProgressCallback: (p) => {
              const pct = Math.round((p && typeof p.progress === 'number' ? p.progress : 0) * 100);
              if (btn) btn.textContent = '[ LOADING · ' + pct + '% ]';
              if (pct % 10 === 0) Log.push('MEM', vector.engine + ' · ' + pct + '%');
            },
          });
          w.engine = engine;
          w.engaged = true;
          w.modelId = vector.engine;
          if (btn) btn.textContent = '[ WEBLLM ENGAGED ]';
          Log.push('SWITCH', '-> Live engine ready: ' + vector.model);
        } catch (e) {
          Log.push('WARN', 'WebLLM engagement failed — deterministic only');
          if (btn) btn.textContent = '[ WEBLLM UNAVAILABLE ]';
        } finally {
          w.loading = false;
        }
      }

      function appendMessage(threadEl, role, text, modelLabel) {
        const bubble = ce('div',
          (role === 'user' ? 'arch-msg-user' : 'arch-msg-spec') + ' rounded p-4 mt-3');
        const headerLabel = role === 'user'

      async function dispatchUserTurn(text, threadEl) {
        // Persist user turn first.
        State.memory.dialogue.history.push({ role: 'user', text });
        if (State.memory.dialogue.history.length > 40) {
          State.memory.dialogue.history = State.memory.dialogue.history.slice(-40);
        }
        persistMemory();
        appendMessage(threadEl, 'user', text);

        // Dispatcher routing — re-route on every turn so a thread can pivot
        // from VECTOR_B to VECTOR_C mid-conversation.
        const vectorId = Orchestrator.route(text);
        const vector = Orchestrator.vectorById(vectorId);
        Orchestrator.setVector(vectorId);
        renderCurrentSpecialist();

        // Threshold pre-check for VECTOR_B keyword triggers — must run BEFORE
        // streaming so the [ALERT] precedes the hand-off in the log.
        const earlyTrigger =
          vector.threshold &&
          vector.threshold.type === 'keyword_trigger' &&
          evaluateThreshold(vector, text);

        // Run the specialist — live engine if engaged, deterministic otherwise.
        // Order: explicitly-engaged WebLLM > build-time OpenAI fallback >
        // deterministic synthesis. Each tier returns null on failure so the
        // next tier picks up cleanly.
        let liveOutput = null;
        if (State.orchestration.webllm.engaged && State.orchestration.webllm.engine) {
          liveOutput = await specialistRunWebLLM(vector, text, threadEl);
        }
        if (liveOutput == null && OPENAI_API_KEY) {
          liveOutput = await specialistRunOpenAI(vector, text, threadEl);
        }
        if (liveOutput == null) {
          if (vector.id === 'A') await specialistRunA(vector, text, threadEl);
          else if (vector.id === 'B') await specialistRunB(vector, text, threadEl);
          else await specialistRunC(vector, text, threadEl);
        }

        // Persist specialist turn (record-only; bubble was already streamed).
        State.memory.dialogue.history.push({
          role: 'specialist',
          text: '[' + vector.code + ' synthesis]',
          modelLabel: vector.model + ' · ' + vector.role.toUpperCase(),
        });
        persistMemory();

        // Threshold post-evaluation + Conversion Component trigger.
        if (earlyTrigger || evaluateThreshold(vector, text)) {
          Orchestrator.setProgress(100, vector.code);
          setTimeout(() => triggerHandoff(vector), 320);
        }
      }

      // ---------- Bio-Digital Link: silent neural pathways ----------
      (function neural() {
        const svg = qs('#neural');

          window.matchMedia &&

        if (reduced) return; // honor user preference, leave the pane blank

        const h = window.innerHeight;

        // Scale fidelity to viewport size: low-end / narrow viewports get a
        // sparser graph, longer connection threshold floor, and no cursor
        // attraction — keeps the fan quiet on phones.
        const small = w < 768;
        const coarse =
          window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        const N = small ? 12 : 26;
        const linkRadius = small ? 160 : 220;
        const targetFps = small ? 30 : 60;
        const frameInterval = 1000 / targetFps;

        const nodes = [];
        for (let i = 0; i < N; i++) {
          const c = document.createElementNS(NS, 'circle');
          const x = Math.random() * w;
          const y = Math.random() * h;
          c.setAttribute('cx', x);
          c.setAttribute('cy', y);
          c.setAttribute('r', 1.2);
          c.setAttribute('fill', 'rgba(224,224,224,0.35)');
          svg.appendChild(c);
          nodes.push({
            x,
            y,
            ox: x,
            oy: y,
            vx: (Math.random() - 0.5) * 0.18,
            vy: (Math.random() - 0.5) * 0.18,
            el: c,
          });
        }

        // Connection lines
        const lines = [];
        for (let i = 0; i < N; i++) {
          for (let j = i + 1; j < N; j++) {
            const dx = nodes[i].x - nodes[j].x;
            const dy = nodes[i].y - nodes[j].y;
            const d = Math.hypot(dx, dy);
            if (d < linkRadius) {
              const ln = document.createElementNS(NS, 'line');
              ln.setAttribute('stroke', 'rgba(224,224,224,0.06)');
              ln.setAttribute('stroke-width', '0.5');
              svg.appendChild(ln);
              lines.push({ a: i, b: j, el: ln });
            }
          }
        }

        let mx = w / 2;
        let my = h / 2;
        // Cursor attraction is only useful with a fine pointer; touch devices
        // never fire mousemove anyway, so don't bother registering it.
        if (!coarse) {
          window.addEventListener(
            'mousemove',
            (e) => {
              mx = e.clientX;
              my = e.clientY;
            },
            { passive: true }
          );
        }
        window.addEventListener('resize', () => {
          svg.setAttribute(
            'viewBox',
            '0 0 ' + window.innerWidth + ' ' + window.innerHeight
          );
        });
        svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);

        let last = 0;
        let running = true;
        // Pause animation while the tab is hidden — saves battery on mobile.
        document.addEventListener('visibilitychange', () => {
          running = !document.hidden;
          if (running) {
            last = 0;
            requestAnimationFrame(frame);
          }
        });

        function frame(now) {
          if (!running) return;
          // Throttle to targetFps on small screens
          if (now - last < frameInterval) {
            requestAnimationFrame(frame);
            return;
          }
          last = now;
          for (const n of nodes) {
            // gentle drift
            n.x += n.vx;
            n.y += n.vy;
            // bounded around origin
            if (Math.abs(n.x - n.ox) > 40) n.vx *= -1;
            if (Math.abs(n.y - n.oy) > 40) n.vy *= -1;
            // subtle attraction toward cursor (skipped on coarse pointers)
            if (!coarse) {
              const dx = mx - n.x;
              const dy = my - n.y;
              const d2 = dx * dx + dy * dy;
              if (d2 < 60000) {
                n.x += (dx / 60000) * 14;
                n.y += (dy / 60000) * 14;
              }
            }
            n.el.setAttribute('cx', n.x.toFixed(2));
            n.el.setAttribute('cy', n.y.toFixed(2));
          }
          for (const l of lines) {
            const a = nodes[l.a];
            const b = nodes[l.b];
            const d = Math.hypot(a.x - b.x, a.y - b.y);
            const op = Math.max(0, 0.18 - d / 1400).toFixed(3);
            l.el.setAttribute('x1', a.x);
            l.el.setAttribute('y1', a.y);
            l.el.setAttribute('x2', b.x);
            l.el.setAttribute('y2', b.y);
            l.el.setAttribute('stroke', 'rgba(250,208,44,' + op + ')');
          }
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      })();

      // ---------- Boot sequence ----------

        try {

          State.manifest = await r.json();
        } catch (e) {

        loadMemory();

        for (const msg of State.manifest.system.boot_sequence) {
          line.textContent = msg;
          await new Promise((res) => setTimeout(res, 360));
        }
        qs('#boot').classList.add('gone');
        setTimeout(() => qs('#boot').remove(), 700);

        renderIntentList();
        renderMemory();
        Log.push('BOOT', 'single-pane glass online');
        Log.push('NOTE', 'session ' + State.sessionId);
        morph(renderConcierge);
      }
