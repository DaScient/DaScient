<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DaScient — Single-Pane Glass. Deterministic intelligence at the seam of biological computing and agentic resilience."
    />
    <title>DaScient // Single-Pane Glass</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind via CDN Play (No-Framework directive). -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Tailwind theme — Single-Pane Glass palette.
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              obsidian: '#050505',
              'obsidian-2': '#0a0a0c',
              'obsidian-3': '#101015',
              gold: '#FAD02C',
              'gold-mute': '#b89a1f',
              concrete: '#E0E0E0',
              'concrete-mute': '#8a8a8a',
            },
            fontFamily: {
              prose: ['Cormorant Garamond', 'serif'],
              sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
            },
          },
        },
      };
    </script>

    <style>
      :root {
        --obsidian: #050505;
        --obsidian-2: #0a0a0c;
        --gold: #fad02c;
        --concrete: #e0e0e0;
        --hairline: rgba(224, 224, 224, 0.08);
        --hairline-strong: rgba(224, 224, 224, 0.16);
      }

      html,
      body {
        height: 100%;
        overflow: hidden; /* Single-Pane: non-scrolling viewport */
        background: var(--obsidian);
        color: var(--concrete);
        font-family: 'Inter', sans-serif;
        font-weight: 300;
        letter-spacing: 0.01em;
        -webkit-font-smoothing: antialiased;
      }

      /* Glass surface: obsidian glassmorphism */
      .glass {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.025) 0%,
          rgba(255, 255, 255, 0.005) 100%
        );
        backdrop-filter: blur(14px) saturate(120%);
        -webkit-backdrop-filter: blur(14px) saturate(120%);
        border: 1px solid var(--hairline);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.04) inset,
          0 24px 60px rgba(0, 0, 0, 0.55);
      }

      .hairline {
        border-color: var(--hairline);
      }
      .hairline-strong {
        border-color: var(--hairline-strong);
      }

      /* Mono telemetry */
      .mono {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 400;
        letter-spacing: 0.02em;
      }

      /* High-contrast prose serif */
      .prose-display {
        font-family: 'Cormorant Garamond', serif;
        font-weight: 500;
        letter-spacing: -0.005em;
      }

      /* Gold accent rule (used minimally) */
      .gold-rule {
        background: linear-gradient(
          90deg,
          transparent 0%,
          var(--gold) 20%,
          var(--gold) 80%,
          transparent 100%
        );
        height: 1px;
        opacity: 0.5;
      }

      /* Caret for terminal */
      .caret::after {
        content: '▍';
        margin-left: 2px;
        color: var(--gold);
        animation: blink 1.05s steps(2, start) infinite;
      }
      @keyframes blink {
        50% { opacity: 0; }
      }

      /* Module morph: blur-and-reveal */
      .stage {
        transition:
          opacity 380ms ease,
          filter 380ms ease,
          transform 380ms ease;
      }
      .stage.hiding {
        opacity: 0;
        filter: blur(14px);
        transform: scale(0.985);
        pointer-events: none;
      }

      /* Status pulse */
      .pulse-dot {
        width: 6px;
        height: 6px;
        border-radius: 9999px;
        background: var(--gold);
        box-shadow: 0 0 0 0 rgba(250, 208, 44, 0.6);
        animation: pulse 2.4s ease-out infinite;
      }
      @keyframes pulse {
        0%   { box-shadow: 0 0 0 0 rgba(250, 208, 44, 0.55); }
        70%  { box-shadow: 0 0 0 10px rgba(250, 208, 44, 0); }
        100% { box-shadow: 0 0 0 0 rgba(250, 208, 44, 0); }
      }

      /* Scrollbar in panels */
      .panel-scroll {
        scrollbar-width: thin;
        scrollbar-color: rgba(224, 224, 224, 0.18) transparent;
      }
      .panel-scroll::-webkit-scrollbar {
        width: 6px;
      }
      .panel-scroll::-webkit-scrollbar-thumb {
        background: rgba(224, 224, 224, 0.14);
        border-radius: 3px;
      }

      /* Selectable command line */
      .cmd-input {
        background: transparent;
        border: none;
        outline: none;
        width: 100%;
        color: var(--concrete);
        font-family: 'JetBrains Mono', monospace;
        caret-color: var(--gold);
      }

      /* Book — minimalist 3D asset */
      .book {
        position: relative;
        width: 110px;
        height: 160px;
        transform-style: preserve-3d;
        transform: rotateY(-22deg) rotateX(4deg);
        transition: transform 420ms ease;
      }
      .book:hover {
        transform: rotateY(-8deg) rotateX(2deg) translateY(-4px);
      }
      .book .face {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(0, 0, 0, 0.4)),
          linear-gradient(135deg, #1a1a1f 0%, #08080a 100%);
        border: 1px solid var(--hairline-strong);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.03),
          0 14px 32px rgba(0, 0, 0, 0.6);
      }
      .book .spine {
        position: absolute;
        left: -10px;
        top: 0;
        bottom: 0;
        width: 10px;
        transform: rotateY(90deg) translateZ(5px);
        background: linear-gradient(180deg, #14141a, #050505);
        border-left: 1px solid var(--hairline);
      }
      .book .pages {
        position: absolute;
        right: -4px;
        top: 4px;
        bottom: 4px;
        width: 4px;
        background: repeating-linear-gradient(
          180deg,
          rgba(224, 224, 224, 0.08) 0 1px,
          transparent 1px 2px
        );
      }
      .book .gold-mark {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 18px;
        height: 1px;
        background: var(--gold);
        opacity: 0.55;
      }
      .book .title-line {
        position: absolute;
        left: 16px;
        right: 16px;
        top: 22px;
        font-family: 'Cormorant Garamond', serif;
        font-size: 13px;
        line-height: 1.15;
        color: var(--concrete);
      }
      .book .sub-line {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 28px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 8px;
        letter-spacing: 0.18em;
        color: var(--gold);
        text-transform: uppercase;
      }

      /* Neural pathway canvas covers viewport behind the HUD */
      #neural {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
      }

      /* Subtle vignette */
      .vignette::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse at center,
          transparent 50%,
          rgba(0, 0, 0, 0.55) 100%
        );
        z-index: 1;
      }

      /* Boot fade */
      #boot {
        transition: opacity 600ms ease;
      }
      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }

      /* Viewport guard for tiny screens — let it scroll instead of crushing */
      @media (max-height: 640px), (max-width: 720px) {
        html, body { overflow: auto; }
      }
    </style>
  </head>

  <body class="vignette">
    <!-- Bio-Digital Link: silent SVG neural pathways -->
    <svg id="neural" aria-hidden="true"></svg>

    <!-- Boot overlay -->
    <div
      id="boot"
      class="fixed inset-0 z-50 flex items-center justify-center bg-obsidian"
    >
      <div class="text-center">
        <div class="mono text-[11px] tracking-[0.32em] text-concrete-mute">
          DASCIENT // SINGLE-PANE GLASS
        </div>
        <div class="gold-rule mt-3 mx-auto" style="width: 220px"></div>
        <div id="boot-line" class="mono text-xs text-concrete mt-6 h-4"></div>
      </div>
    </div>

    <!-- HUD -->
    <div class="relative z-10 h-screen w-screen p-4 md:p-5">
      <div
        class="grid h-full w-full gap-3 md:gap-4"
        style="grid-template-columns: 240px 1fr 280px; grid-template-rows: 56px 1fr 44px"
      >
        <!-- Top bar (spans all columns) -->
        <header
          class="glass col-span-3 flex items-center justify-between px-5 rounded"
          style="grid-row: 1"
        >
          <div class="flex items-center gap-3">
            <div class="pulse-dot"></div>
            <div class="mono text-[11px] tracking-[0.28em] text-concrete">
              DASCIENT
            </div>
            <div class="hidden md:block mono text-[10px] tracking-[0.24em] text-concrete-mute">
              · SINGLE-PANE GLASS · v1.0
            </div>
          </div>
          <div class="hidden md:flex items-center gap-6 mono text-[10px] tracking-[0.22em] text-concrete-mute">
            <span id="hud-clock">--:--:--&nbsp;UTC</span>
            <span>SESSION&nbsp;<span id="hud-session" class="text-concrete">—</span></span>
            <span>INTENT&nbsp;<span id="hud-intent" class="text-gold">IDLE</span></span>
          </div>
        </header>

        <!-- Left rail: Intent selector -->
        <aside
          class="glass rounded p-4 flex flex-col"
          style="grid-row: 2"
        >
          <div class="mono text-[10px] tracking-[0.24em] text-concrete-mute mb-3">
            INTENTS
          </div>
          <nav id="intent-list" class="flex flex-col gap-1 flex-1 panel-scroll overflow-y-auto"></nav>
          <div class="gold-rule my-3"></div>
          <div class="mono text-[10px] tracking-[0.22em] text-concrete-mute leading-relaxed">
            No links. Only<br />executing commands.
          </div>
        </aside>

        <!-- Center workspace -->
        <main
          class="glass rounded relative overflow-hidden"
          style="grid-row: 2"
        >
          <div id="stage" class="stage absolute inset-0 p-8 md:p-10 flex flex-col"></div>
        </main>

        <!-- Right rail: System Log + Session Memory -->
        <aside
          class="glass rounded p-4 flex flex-col gap-3"
          style="grid-row: 2"
        >
          <div class="flex items-center justify-between">
            <div class="mono text-[10px] tracking-[0.24em] text-concrete-mute">
              SYSTEM LOG
            </div>
            <div class="mono text-[9px] tracking-[0.22em] text-gold">LIVE</div>
          </div>
          <div
            id="syslog"
            class="mono text-[10px] leading-relaxed text-concrete-mute flex-1 overflow-y-auto panel-scroll pr-1"
          ></div>
          <div class="gold-rule"></div>
          <div>
            <div class="mono text-[10px] tracking-[0.24em] text-concrete-mute mb-2">
              SESSION MEMORY
            </div>
            <div id="memory" class="mono text-[10px] text-concrete leading-relaxed"></div>
          </div>
        </aside>

        <!-- Bottom bar -->
        <footer
          class="glass col-span-3 flex items-center justify-between px-5 rounded"
          style="grid-row: 3"
        >
          <div class="prose-display italic text-[15px] text-concrete">
            We don't build software; we engineer resilience.
          </div>
          <div class="mono text-[10px] tracking-[0.22em] text-concrete-mute">
            BIO-DIGITAL · AGENTIC · DETERMINISTIC
          </div>
        </footer>
      </div>
    </div>

    <!-- ================================================================== -->
    <!-- Single-Pane Engine (Vanilla JS, manifest-driven, state-driven UI). -->
    <!-- ================================================================== -->
    <script>
      'use strict';

      // ---------- Utilities ----------
      const qs = (s, r = document) => r.querySelector(s);
      const ce = (t, c) => {
        const e = document.createElement(t);
        if (c) e.className = c;
        return e;
      };
      const escapeHtml = (s) =>
        String(s).replace(/[&<>"']/g, (m) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;',
        }[m]));

      // ---------- State ----------
      const STORE_KEY = 'dascient.session.v1';
      const State = {
        manifest: null,
        intent: null,
        sessionId: null,
        memory: { events: [], lastIntent: null, bookings: [] },
      };

      function loadMemory() {
        try {
          const raw = localStorage.getItem(STORE_KEY);
          if (raw) State.memory = { ...State.memory, ...JSON.parse(raw) };
        } catch (_) {
          /* deterministic ignore */
        }
        if (!State.memory.sessionId) {
          State.memory.sessionId = signedHash('session', Date.now());
        }
        State.sessionId = State.memory.sessionId;
      }
      function persistMemory() {
        try {
          localStorage.setItem(STORE_KEY, JSON.stringify(State.memory));
        } catch (_) {
          /* */
        }
      }

      // Deterministic visual "signed hash" — not a security primitive, a UI flair.
      function signedHash(prefix, seed) {
        const s = String(prefix) + ':' + String(seed);
        let h = 2166136261 >>> 0;
        for (let i = 0; i < s.length; i++) {
          h ^= s.charCodeAt(i);
          h = Math.imul(h, 16777619) >>> 0;
        }
        const hex = ('00000000' + h.toString(16)).slice(-8);
        return hex.toUpperCase();
      }

      // ---------- System Log (Agentic Events) ----------
      const Log = {
        el: null,
        push(level, msg) {
          if (!this.el) this.el = qs('#syslog');
          const t = new Date();
          const ts =
            String(t.getUTCHours()).padStart(2, '0') +
            ':' +
            String(t.getUTCMinutes()).padStart(2, '0') +
            ':' +
            String(t.getUTCSeconds()).padStart(2, '0');
          const line = ce('div');
          const lvlColor =
            level === 'EXEC'
              ? 'text-gold'
              : level === 'WARN'
              ? 'text-gold-mute'
              : 'text-concrete';
          line.innerHTML =
            '<span class="text-concrete-mute">' +
            ts +
            '</span> ' +
            '<span class="' +
            lvlColor +
            '">' +
            escapeHtml(level) +
            '</span> ' +
            '<span>' +
            escapeHtml(msg) +
            '</span>';
          this.el.appendChild(line);
          this.el.scrollTop = this.el.scrollHeight;

          State.memory.events.push({ ts: t.toISOString(), level, msg });
          if (State.memory.events.length > 60)
            State.memory.events = State.memory.events.slice(-60);
          persistMemory();
        },
      };

      // ---------- Typewriter ----------
      function typewriter(node, text, speed = 14) {
        return new Promise((resolve) => {
          node.textContent = '';
          node.classList.add('caret');
          let i = 0;
          const step = () => {
            if (i >= text.length) {
              node.classList.remove('caret');
              return resolve();
            }
            node.textContent += text.charAt(i++);
            setTimeout(step, speed);
          };
          step();
        });
      }

      // ---------- HUD chrome ----------
      function tickClock() {
        const el = qs('#hud-clock');
        if (!el) return;
        const t = new Date();
        const fmt = (n) => String(n).padStart(2, '0');
        el.textContent =
          fmt(t.getUTCHours()) +
          ':' +
          fmt(t.getUTCMinutes()) +
          ':' +
          fmt(t.getUTCSeconds()) +
          ' UTC';
      }
      setInterval(tickClock, 1000);
      tickClock();

      // ---------- Stage Morph ----------
      const stage = () => qs('#stage');
      function morph(renderFn) {
        const s = stage();
        s.classList.add('hiding');
        setTimeout(() => {
          s.innerHTML = '';
          renderFn(s);
          // Force a synchronous reflow so the browser commits the new DOM /
          // initial 'hiding' styles before we remove the class — this is what
          // produces the blur-and-reveal transition rather than an instant swap.
          void s.offsetHeight;
          s.classList.remove('hiding');
        }, 380);
      }

      // ---------- Renderers ----------
      function renderIntentList() {
        const list = qs('#intent-list');
        list.innerHTML = '';
        State.manifest.intents.forEach((it) => {
          const btn = ce(
            'button',
            'group text-left px-3 py-2 rounded hairline border transition ' +
              'hover:bg-white/[0.03] focus:outline-none focus:bg-white/[0.04]'
          );
          btn.dataset.intent = it.id;
          btn.innerHTML =
            '<div class="mono text-[10px] tracking-[0.18em] text-concrete-mute group-hover:text-gold transition">' +
            escapeHtml(it.command) +
            '</div>' +
            '<div class="text-[13px] text-concrete mt-1">' +
            escapeHtml(it.label) +
            '</div>';
          btn.addEventListener('click', () => selectIntent(it.id));
          list.appendChild(btn);
        });
      }

      function selectIntent(id) {
        const intent = State.manifest.intents.find((i) => i.id === id);
        if (!intent) return;
        State.intent = intent;
        State.memory.lastIntent = id;
        persistMemory();
        qs('#hud-intent').textContent = intent.command;
        Log.push('EXEC', intent.command);

        switch (id) {
          case 'proposal':
            return morph(renderProposalModule);
          case 'booking':
            return morph(renderBookingModule);
          case 'modules':
            return morph(renderArtifactCarousel);
          case 'library':
            return morph(renderLibrary);
          case 'about':
            return morph(renderArchitectBriefing);
          default:
            return morph(renderConcierge);
        }
      }

      // ---------- Concierge (entry point) ----------
      function renderConcierge(s) {
        const wrap = ce('div', 'flex-1 flex flex-col items-center justify-center text-center');
        wrap.innerHTML =
          '<div class="mono text-[10px] tracking-[0.28em] text-concrete-mute">' +
          'AGENTIC CONCIERGE // ARCHITECT MODE' +
          '</div>' +
          '<div class="gold-rule mt-3" style="width: 220px"></div>' +
          '<h1 id="concierge-prompt" class="prose-display text-[34px] md:text-[44px] leading-tight mt-8 max-w-3xl"></h1>' +
          '<p id="concierge-sub" class="mt-6 max-w-xl text-concrete-mute text-[14px] leading-relaxed"></p>' +
          '<form id="concierge-form" class="mt-10 w-full max-w-xl">' +
          '  <div class="flex items-center gap-3 px-4 py-3 hairline border rounded bg-white/[0.02]">' +
          '    <span class="mono text-gold text-[12px]">›</span>' +
          '    <input id="concierge-input" class="cmd-input text-[14px]" autocomplete="off" placeholder="state intent — e.g. proposal, booking, library" />' +
          '  </div>' +
          '  <div class="mono text-[10px] tracking-[0.22em] text-concrete-mute mt-3">' +
          '    [enter] to dispatch &nbsp;·&nbsp; deterministic parse only' +
          '  </div>' +
          '</form>';
        s.appendChild(wrap);

        const heading = qs('#concierge-prompt', wrap);
        const sub = qs('#concierge-sub', wrap);
        typewriter(heading, State.manifest.system.concierge_prompt, 22).then(() => {
          sub.textContent =
            'I am the Architect — not a chatbot. Responses are brief, ' +
            'high-level, deterministic. Select a module from the left rail or ' +
            'type an intent below.';
        });

        const form = qs('#concierge-form', wrap);
        const input = qs('#concierge-input', wrap);
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          parseIntent(input.value.trim());
          input.value = '';
        });
      }

      function parseIntent(text) {
        if (!text) return;
        Log.push('PARSE', '"' + text + '"');
        const t = text.toLowerCase();
        const aliases = [
          { id: 'proposal', words: ['proposal', 'grant', 'doe', 'darpa', 'nih', 'craft'] },
          { id: 'booking', words: ['booking', 'book', 'session', 'consult', 'schedule', 'meet'] },
          { id: 'modules', words: ['module', 'artifact', 'repo', 'plan', 'organoid', 'ares'] },
          { id: 'library', words: ['library', 'book', 'read', 'doctrine', 'literacy'] },
          { id: 'about', words: ['about', 'who', 'thesis', 'brief', 'architect'] },
        ];
        let match = null;
        for (const a of aliases) {
          if (a.words.some((w) => t.includes(w))) {
            match = a.id;
            break;
          }
        }
        if (!match) {
          Log.push('WARN', 'intent unresolved');
          flashUnresolved();
          return;
        }
        selectIntent(match);
      }

      function flashUnresolved() {
        const s = stage();
        const flash = ce(
          'div',
          'absolute inset-x-0 bottom-6 mx-auto max-w-md text-center mono ' +
            'text-[11px] tracking-[0.22em] text-gold'
        );
        flash.textContent = State.manifest.concierge_responses.default.toUpperCase();
        s.appendChild(flash);
        setTimeout(() => flash.remove(), 2400);
      }

      // ---------- Module: Proposal Crafting (Grant Logic) ----------
      function renderProposalModule(s) {
        const r = State.manifest.concierge_responses.proposal;
        s.innerHTML =
          '<div class="mono text-[10px] tracking-[0.28em] text-gold">' +
          'EXEC :: GRANT_LOGIC' +
          '</div>' +
          '<h2 class="prose-display text-[30px] md:text-[36px] mt-3 leading-tight">' +
          'Proposal Crafting' +
          '</h2>' +
          '<div class="gold-rule mt-3" style="max-width: 200px"></div>' +
          '<p id="grant-resp" class="mt-6 text-concrete-mute text-[13px] leading-relaxed max-w-2xl"></p>' +
          '<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-8 flex-1">' +
          '  <div class="hairline border rounded p-5 bg-white/[0.015]">' +
          '    <div class="mono text-[10px] tracking-[0.22em] text-concrete-mute">PROGRAM SOLICITATION</div>' +
          '    <textarea id="g-sol" rows="5" class="cmd-input mt-3 resize-none w-full text-[12px]" placeholder="paste FOA / BAA / RFP language…"></textarea>' +
          '  </div>' +
          '  <div class="hairline border rounded p-5 bg-white/[0.015]">' +
          '    <div class="mono text-[10px] tracking-[0.22em] text-concrete-mute">TARGET OUTCOME</div>' +
          '    <textarea id="g-out" rows="5" class="cmd-input mt-3 resize-none w-full text-[12px]" placeholder="state the operational outcome you intend to engineer…"></textarea>' +
          '  </div>' +
          '  <div class="hairline border rounded p-5 bg-white/[0.015] md:col-span-2">' +
          '    <div class="flex items-center justify-between">' +
          '      <div class="mono text-[10px] tracking-[0.22em] text-concrete-mute">SYNTHESIZED STRESS PARAMETERS</div>' +
          '      <button id="g-synth" class="mono text-[10px] tracking-[0.22em] text-gold hover:text-concrete transition">[ SYNTHESIZE ]</button>' +
          '    </div>' +
          '    <div id="g-output" class="mono text-[11px] mt-3 text-concrete leading-relaxed min-h-[64px]"></div>' +
          '  </div>' +
          '</div>';

        typewriter(qs('#grant-resp', s), r, 10);

      // ---------- Bio-Digital Link: silent neural pathways ----------
      (function neural() {
        const svg = qs('#neural');
        const NS = 'http://www.w3.org/2000/svg';
        const N = 26;
        const nodes = [];
        const w = window.innerWidth;
        const h = window.innerHeight;

        for (let i = 0; i < N; i++) {
          const c = document.createElementNS(NS, 'circle');
          const x = Math.random() * w;
          const y = Math.random() * h;
          c.setAttribute('cx', x);
          c.setAttribute('cy', y);
          c.setAttribute('r', 1.2);
          c.setAttribute('fill', 'rgba(224,224,224,0.35)');
          svg.appendChild(c);
          nodes.push({
            x,
            y,
            ox: x,
            oy: y,
            vx: (Math.random() - 0.5) * 0.18,
            vy: (Math.random() - 0.5) * 0.18,
            el: c,
          });
        }

        // Connection lines
        const lines = [];
        for (let i = 0; i < N; i++) {
          for (let j = i + 1; j < N; j++) {
            const dx = nodes[i].x - nodes[j].x;
            const dy = nodes[i].y - nodes[j].y;
            const d = Math.hypot(dx, dy);
            if (d < 220) {
              const ln = document.createElementNS(NS, 'line');
              ln.setAttribute('stroke', 'rgba(224,224,224,0.06)');
              ln.setAttribute('stroke-width', '0.5');
              svg.appendChild(ln);
              lines.push({ a: i, b: j, el: ln });
            }
          }
        }

        let mx = w / 2;
        let my = h / 2;
        window.addEventListener('mousemove', (e) => {
          mx = e.clientX;
          my = e.clientY;
        });
        window.addEventListener('resize', () => {
          svg.setAttribute('viewBox', '0 0 ' + window.innerWidth + ' ' + window.innerHeight);
        });
        svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);

        function frame() {
          for (const n of nodes) {
            // gentle drift
            n.x += n.vx;
            n.y += n.vy;
            // bounded around origin
            if (Math.abs(n.x - n.ox) > 40) n.vx *= -1;
            if (Math.abs(n.y - n.oy) > 40) n.vy *= -1;
            // subtle attraction toward cursor
            const dx = mx - n.x;
            const dy = my - n.y;
            const d2 = dx * dx + dy * dy;
            if (d2 < 60000) {
              n.x += (dx / 60000) * 14;
              n.y += (dy / 60000) * 14;
            }
            n.el.setAttribute('cx', n.x.toFixed(2));
            n.el.setAttribute('cy', n.y.toFixed(2));
          }
          for (const l of lines) {
            const a = nodes[l.a];
            const b = nodes[l.b];
            const d = Math.hypot(a.x - b.x, a.y - b.y);
            const op = Math.max(0, 0.18 - d / 1400).toFixed(3);
            l.el.setAttribute('x1', a.x);
            l.el.setAttribute('y1', a.y);
            l.el.setAttribute('x2', b.x);
            l.el.setAttribute('y2', b.y);
            l.el.setAttribute('stroke', 'rgba(250,208,44,' + op + ')');
          }
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      })();

          State.manifest = await r.json();

          State.manifest = INLINE_MANIFEST;

        loadMemory();

        for (const msg of State.manifest.system.boot_sequence) {
          line.textContent = msg;
          await new Promise((res) => setTimeout(res, 360));

        renderIntentList();

        Log.push('BOOT', 'single-pane glass online');
        Log.push('NOTE', 'session ' + State.sessionId);
