<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DaScient — a focused interface for biological computing and agentic systems work."
    />
    <title>DaScient</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind via CDN Play. Utility classes still consumed by the renderers;
         the heavy lifting is done by the inline CSS-vars system below. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink:    '#0a0a0c',
              paper:  '#0e0e11',
              text:   '#e6e6e6',
              accent: '#fad02c',
            },
            fontFamily: {
              prose: ['Cormorant Garamond', 'serif'],
              sans:  ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              mono:  ['JetBrains Mono', 'ui-monospace', 'monospace'],
            },
          },
        },
      };
    </script>

    <style>
      /* Atelier — 5-token palette. */
      :root {
        --ink:    #0a0a0c;
        --paper:  #0e0e11;
        --rule:   rgba(224, 224, 224, 0.10);
        --text:   #e6e6e6;
        --accent: #fad02c;
      }

      *, *::before, *::after { box-sizing: border-box; }

      html, body {
        background: var(--ink);
        color: var(--text);
        font-family: 'Inter', sans-serif;
        font-weight: 300;
        font-size: 16px;
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
        margin: 0;
      }

      a { color: inherit; }
      button { font-family: inherit; }

      .display {
        font-family: 'Cormorant Garamond', serif;
        font-weight: 500;
        letter-spacing: -0.005em;
      }
      .mono {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 400;
      }

      /* Layout shell. */
      .container {
        max-width: 880px;
        margin: 0 auto;
        padding: 0 24px;
      }

      /* Top bar. */
      .topbar {
        border-bottom: 1px solid var(--rule);
      }
      .topbar-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 22px 0;
      }
      .wordmark {
        font-family: 'Cormorant Garamond', serif;
        font-weight: 500;
        font-size: 22px;
        letter-spacing: 0.01em;
        text-decoration: none;
        color: var(--text);
      }

      /* Hero. */
      .hero {
        padding: 72px 0 56px;
      }
      .hero h1 {
        font-family: 'Cormorant Garamond', serif;
        font-weight: 500;
        font-size: 44px;
        line-height: 1.15;
        margin: 0 0 18px;
        letter-spacing: -0.005em;
      }
      .hero p {
        max-width: 60ch;
        color: rgba(230, 230, 230, 0.78);
        margin: 0 0 28px;
      }

      /* Concierge bar. */
      .concierge {
        padding: 8px 0 24px;
      }
      .concierge-input-wrap {
        display: flex;
        align-items: center;
        gap: 12px;
        border: 1px solid var(--rule);
        border-radius: 4px;
        padding: 12px 16px;
        background: var(--paper);
        transition: border-color 200ms ease;
      }
      .concierge-input-wrap:focus-within {
        border-color: var(--accent);
      }
      .concierge-input {
        flex: 1;
        background: transparent;
        border: 0;
        outline: 0;
        color: var(--text);
        font-family: 'Inter', sans-serif;
        font-size: 15px;
        font-weight: 400;
      }
      .concierge-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
      }
      .chip {
        background: transparent;
        color: rgba(230, 230, 230, 0.78);
        border: 1px solid var(--rule);
        border-radius: 999px;
        padding: 6px 14px;
        font-size: 13px;
        cursor: pointer;
        transition: color 200ms ease, border-color 200ms ease;
      }
      .chip:hover, .chip:focus-visible {
        color: var(--text);
        border-color: rgba(230, 230, 230, 0.35);
        outline: none;
      }
      .chip-active {
        color: var(--ink);
        background: var(--accent);
        border-color: var(--accent);
      }

      /* Module card. */
      .module-card {
        border: 1px solid var(--rule);
        border-radius: 4px;
        padding: 32px;
        margin: 12px 0 56px;
        background: var(--paper);
      }
      .module-card .kicker {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        letter-spacing: 0.18em;
        color: rgba(230, 230, 230, 0.55);
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      .module-card h2 {
        font-family: 'Cormorant Garamond', serif;
        font-weight: 500;
        font-size: 30px;
        line-height: 1.2;
        margin: 0 0 16px;
      }
      .module-card .lede {
        color: rgba(230, 230, 230, 0.78);
        max-width: 60ch;
        margin: 0 0 24px;
      }
      .module-card .field {
        margin-top: 18px;
      }
      .module-card label {
        display: block;
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        letter-spacing: 0.14em;
        color: rgba(230, 230, 230, 0.55);
        text-transform: uppercase;
        margin-bottom: 6px;
      }
      .module-card textarea,
      .module-card input[type="text"],
      .module-card input[type="email"] {
        width: 100%;
        background: var(--ink);
        color: var(--text);
        border: 1px solid var(--rule);
        border-radius: 3px;
        padding: 10px 12px;
        font: inherit;
        font-size: 14px;
        outline: none;
      }
      .module-card textarea {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        resize: vertical;
        min-height: 100px;
      }
      .module-card textarea:focus,
      .module-card input:focus {
        border-color: var(--accent);
      }

      /* Buttons. One CTA per view — gold. */
      .btn-primary {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--accent);
        color: var(--ink);
        border: 1px solid var(--accent);
        border-radius: 3px;
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: opacity 200ms ease;
      }
      .btn-primary:hover { opacity: 0.85; }
      .btn-primary:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        background: transparent;
        color: rgba(230, 230, 230, 0.55);
        border-color: var(--rule);
      }
      .btn-ghost {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--rule);
        border-radius: 3px;
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 400;
        cursor: pointer;
        transition: border-color 200ms ease, color 200ms ease;
      }
      .btn-ghost:hover {
        border-color: rgba(230, 230, 230, 0.35);
      }

      /* Hairline rule used sparingly. */
      .rule { border-top: 1px solid var(--rule); margin: 24px 0; }
      .rule-accent {
        height: 1px;
        background: var(--accent);
        opacity: 0.55;
        width: 64px;
        margin: 14px 0 22px;
      }

      /* Mono ref/hash chips. */
      .ref-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        letter-spacing: 0.08em;
        color: var(--accent);
        border: 1px solid var(--rule);
        border-radius: 3px;
        padding: 4px 10px;
      }
      .ref-chip .ref-label {
        color: rgba(230, 230, 230, 0.55);
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      /* Dialogue thread bubbles — flat, no glass. */
      .arch-msg-user, .arch-msg-spec {
        border: 1px solid var(--rule);
        border-radius: 3px;
        padding: 14px 16px;
        margin-top: 10px;
      }
      .arch-msg-user {
        background: rgba(250, 208, 44, 0.04);
        border-color: rgba(250, 208, 44, 0.20);
      }
      .arch-msg-spec {
        background: var(--ink);
      }
      .arch-msg-spec pre, .arch-msg-spec .body {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12.5px;
        white-space: pre-wrap;
        margin: 0;
      }

      /* Threshold meter. */
      .meter-track {
        background: var(--rule);
        height: 2px;
        border-radius: 1px;
        overflow: hidden;
      }
      .meter-fill {
        height: 100%;
        background: var(--accent);
        transition: width 480ms ease;
      }

      /* Stage subtle fade transition (replaces blur-and-reveal). */
      .stage { transition: opacity 200ms ease; }
      .stage.hiding { opacity: 0; pointer-events: none; }

      /* Footer + log drawer. */
      .footer {
        border-top: 1px solid var(--rule);
        padding: 22px 0 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 13px;
        color: rgba(230, 230, 230, 0.55);
      }
      .footer .link {
        background: none;
        border: 0;
        cursor: pointer;
        color: rgba(230, 230, 230, 0.55);
        text-decoration: underline;
        text-decoration-color: rgba(230, 230, 230, 0.18);
        text-underline-offset: 3px;
        font: inherit;
      }
      .footer .link:hover { color: var(--text); }
      .log-drawer {
        border-top: 1px solid var(--rule);
        background: var(--paper);
        padding: 18px 0;
        max-height: 0;
        overflow: hidden;
        transition: max-height 240ms ease;
      }
      .log-drawer.open { max-height: 280px; }
      .log-drawer .container { display: flex; flex-direction: column; gap: 8px; }
      .log-drawer .log-head {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        letter-spacing: 0.14em;
        color: rgba(230, 230, 230, 0.55);
        text-transform: uppercase;
      }
      #syslog {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11.5px;
        line-height: 1.7;
        color: rgba(230, 230, 230, 0.78);
        max-height: 200px;
        overflow-y: auto;
      }
      #syslog .ts { color: rgba(230, 230, 230, 0.45); }
      #syslog .lvl-EXEC,
      #syslog .lvl-ALERT { color: var(--accent); }
      #syslog .lvl-WARN  { color: #b89a1f; }

      /* Cooling timer ring/label. */
      .cooling-bar {
        margin-top: 18px;
        padding: 14px 16px;
        border: 1px solid var(--rule);
        border-radius: 3px;
        background: var(--ink);
      }
      .cooling-line {
        font-size: 13px;
        color: rgba(230, 230, 230, 0.78);
        margin: 0 0 8px;
      }
      .cooling-meter { height: 2px; background: var(--rule); border-radius: 1px; overflow: hidden; }
      .cooling-fill  { height: 100%; background: var(--accent); transition: width 200ms linear; }

      /* Reduced motion. */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          transition-duration: 0.001ms !important;
          animation-duration: 0.001ms !important;
        }
      }

      /* Narrow viewports. */
      @media (max-width: 720px) {
        .container { padding: 0 18px; }
        .hero { padding: 48px 0 40px; }
        .hero h1 { font-size: 34px; }
        .module-card { padding: 22px; }
        .module-card h2 { font-size: 26px; }
      }
    </style>
  </head>

  <body>
    <header class="topbar">
      <div class="container topbar-inner">
        <a href="#" class="wordmark">DaScient</a>
        <nav class="mono" style="font-size: 11px; letter-spacing: 0.18em; color: rgba(230,230,230,0.55);">
          <a href="#concierge-input" id="nav-begin" style="text-decoration: none; color: inherit;">BEGIN</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="hero" id="hero">
        <h1 id="hero-title">We engineer resilient systems.</h1>
        <p id="hero-synopsis">A focused interface for biological computing and agentic systems work.</p>
        <button id="hero-cta" class="btn-primary" type="button">Begin</button>
      </section>

      <section class="concierge">
        <form id="concierge-form" autocomplete="off">
          <div class="concierge-input-wrap">
            <input
              id="concierge-input"
              class="concierge-input"
              type="text"
              placeholder="State an intent — e.g. craft a DOE proposal, book a session, browse the library"
              aria-label="Concierge input"
            />
            <button type="submit" class="btn-ghost" style="padding: 6px 14px; font-size: 13px;">
              Dispatch
            </button>
          </div>
        </form>
        <div id="intent-list" class="concierge-chips" role="list"></div>
        <div id="concierge-flash" class="mono" style="margin-top: 10px; font-size: 11px; color: var(--accent); min-height: 14px;"></div>
      </section>

      <section id="stage" class="stage" aria-live="polite"></section>
    </main>

    <footer class="footer">
      <div class="container" style="display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 0 24px;">
        <span>© <span id="footer-year"></span> DaScient</span>
        <button id="log-toggle" class="link" type="button" aria-expanded="false">system log</button>
        <span class="mono" id="footer-version" style="font-size: 11px; letter-spacing: 0.14em; color: rgba(230,230,230,0.45);">v—</span>
      </div>
    </footer>

    <div id="log-drawer" class="log-drawer" aria-hidden="true">
      <div class="container">
        <div class="log-head">SYSTEM LOG</div>
        <div id="syslog"></div>
      </div>
    </div>

    <!-- ================================================================== -->
    <!-- Engine (vanilla JS, manifest-driven). Logic preserved from the      -->
    <!-- prior single-pane build; render layer rewritten for the new tokens. -->
    <!-- ================================================================== -->
    <script>
      'use strict';
      // ---------- Utilities ----------
      const qs = (s, r = document) => r.querySelector(s);
      const ce = (t, c) => {
        const e = document.createElement(t);
        if (c) e.className = c;
        return e;
      };
      const escapeHtml = (s) =>
        String(s).replace(/[&<>"']/g, (m) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;',
          '"': '&quot;', "'": '&#39;',
        }[m]));

      // ---------- State ----------
      const STORE_KEY = 'dascient.session.v1';
      // Build-time injected key. Replaced by Vite's transformIndexHtml (see
      // vite.config.js). Empty string disables the OpenAI fallback. SECURITY
      // CAVEAT: visible to any visitor of the deployed site — only acceptable
      // for an origin-restricted, rate-limited key. Prefer the Cloudflare
      // Worker proxy (Part 3 / CLOUDFLARE.md) when possible; the front-end
      // will use the proxy whenever manifest.orchestration.proxy_endpoint
      // is set.
      const OPENAI_API_KEY = '__OPENAI_API_KEY__';
      const OPENAI_MODEL = 'gpt-4o-mini';
      const State = {
        manifest: null,
        intent: null,
        sessionId: null,
        orchestration: {
          currentModel: null,
          currentVector: null,
          progress: 0,
          handoffShown: false,
          webllm: { engaged: false, engine: null, modelId: null, loading: false },
        },
        memory: {
          events: [],
          lastIntent: null,
          bookings: [],
          dialogue: { vector: null, history: [], recruitment: { answers: [], step: 0, completed: false } },
        },
      };

      function loadMemory() {
        try {
          const raw = localStorage.getItem(STORE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            State.memory = { ...State.memory, ...parsed };
            const d = State.memory.dialogue || {};
            const r = d.recruitment || {};
            State.memory.dialogue = {
              vector: d.vector || null,
              history: Array.isArray(d.history) ? d.history : [],
              recruitment: {
                answers: Array.isArray(r.answers) ? r.answers : [],
                step: typeof r.step === 'number' ? r.step : 0,
                completed: !!r.completed,
              },
            };
          }
        } catch (_) { /* ignore */ }
        if (!State.memory.sessionId) {
          State.memory.sessionId = signedHash('session', Date.now());
        }
        State.sessionId = State.memory.sessionId;
      }
      function persistMemory() {
        try { localStorage.setItem(STORE_KEY, JSON.stringify(State.memory)); }
        catch (_) { /* */ }
      }

      // Deterministic visual hash — UI flair, not a security primitive.
      function signedHash(prefix, seed) {
        const s = String(prefix) + ':' + String(seed);
        let h = 2166136261 >>> 0;
        for (let i = 0; i < s.length; i++) {
          h ^= s.charCodeAt(i);
          h = Math.imul(h, 16777619) >>> 0;
        }
        return ('00000000' + h.toString(16)).slice(-8).toUpperCase();
      }

      // ---------- System Log ----------
      const Log = {
        el: null,
        push(level, msg) {
          if (!this.el) this.el = qs('#syslog');
          const t = new Date();
          const ts =
            String(t.getUTCHours()).padStart(2, '0') + ':' +
            String(t.getUTCMinutes()).padStart(2, '0') + ':' +
            String(t.getUTCSeconds()).padStart(2, '0');
          if (this.el) {
            const line = ce('div');
            line.innerHTML =
              '<span class="ts">' + ts + '</span> ' +
              '<span class="lvl-' + escapeHtml(level) + '">' + escapeHtml(level) + '</span> ' +
              '<span>' + escapeHtml(msg) + '</span>';
            this.el.appendChild(line);
            this.el.scrollTop = this.el.scrollHeight;
          }
          State.memory.events.push({ ts: t.toISOString(), level, msg });
          if (State.memory.events.length > 60)
            State.memory.events = State.memory.events.slice(-60);
          persistMemory();
        },
      };

      // ---------- Subtle typewriter (used once per view on the lede). ----------
      function typewriter(node, text, speed = 14) {
        return new Promise((resolve) => {
          node.textContent = '';
          let i = 0;
          const step = () => {
            if (i >= text.length) return resolve();
            node.textContent += text.charAt(i++);
            setTimeout(step, speed);
          };
          step();
        });
      }

      // ---------- Stage swap (replaces blur-and-reveal). ----------
      const stage = () => qs('#stage');
      function morph(renderFn) {
        const s = stage();
        s.classList.add('hiding');
        setTimeout(() => {
          s.innerHTML = '';
          renderFn(s);
          void s.offsetHeight;
          s.classList.remove('hiding');
          // Bring the rendered module into view for the user.
          const card = s.querySelector('.module-card');
          if (card && typeof card.scrollIntoView === 'function') {
            card.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        }, 200);
      }

      // ---------- Intent chips ----------
      function renderIntentList() {
        const list = qs('#intent-list');
        list.innerHTML = '';
        State.manifest.intents.forEach((it) => {
          const btn = ce('button', 'chip');
          btn.type = 'button';
          btn.dataset.intent = it.id;
          btn.setAttribute('role', 'listitem');
          btn.textContent = it.label;
          btn.title = it.synopsis || it.label;
          btn.addEventListener('click', () => selectIntent(it.id));
          list.appendChild(btn);
        });
      }

      function highlightChip(id) {
        document.querySelectorAll('#intent-list .chip').forEach((c) => {
          c.classList.toggle('chip-active', c.dataset.intent === id);
        });
      }

      function selectIntent(id) {
        const intent = State.manifest.intents.find((i) => i.id === id);
        if (!intent) return;
        State.intent = intent;
        State.memory.lastIntent = id;
        persistMemory();
        highlightChip(id);
        Log.push('EXEC', intent.command);
        switch (id) {
          case 'proposal': return morph(renderProposalModule);
          case 'booking':  return morph(renderBookingModule);
          case 'modules':  return morph(renderArtifactCarousel);
          case 'library':  return morph(renderLibrary);
          case 'about':    return morph(renderArchitectBriefing);
          case 'dialogue': return morph(renderOrchestratorModule);
          default:         return;
        }
      }

      function parseIntent(text) {
        if (!text) return;
        Log.push('PARSE', '"' + text + '"');
        const t = text.toLowerCase();
        const aliases = [
          { id: 'proposal', words: ['proposal','grant','doe','darpa','nih','craft'] },
          { id: 'booking',  words: ['booking','book','session','consult','schedule','meet'] },
          { id: 'modules',  words: ['module','artifact','repo','plan','organoid','ares'] },
          { id: 'library',  words: ['library','read','doctrine','literacy'] },
          { id: 'about',    words: ['about','who','thesis','brief'] },
          { id: 'dialogue', words: ['dialogue','chat','talk','agent','agentic','develop',
                                    'hire','join','career','recruit','team','orchestrat',
                                    'specialist','webllm'] },
        ];
        let match = null;
        for (const a of aliases) {
          if (a.words.some((w) => t.includes(w))) { match = a.id; break; }
        }
        if (!match) {
          Log.push('WARN', 'intent unresolved');
          flashUnresolved();
          return;
        }
        selectIntent(match);
      }

      function flashUnresolved() {
        const f = qs('#concierge-flash');
        if (!f) return;
        f.textContent = (State.manifest.concierge_responses.default || 'Intent unresolved.');
        clearTimeout(flashUnresolved._t);
        flashUnresolved._t = setTimeout(() => { f.textContent = ''; }, 2400);
      }

      // ============================================================
      // Module: Proposal Crafting (Grant Logic) — review → cooling → email
      // ============================================================
      function renderProposalModule(s) {
        const r = State.manifest.concierge_responses.proposal;
        const card = ce('div', 'module-card');
        card.innerHTML =
          '<div class="kicker">Proposal · Grant Logic</div>' +
          '<h2>Proposal Crafting</h2>' +
          '<div class="rule-accent"></div>' +
          '<p class="lede" id="grant-resp"></p>' +
          '<div class="field">' +
          '  <label for="g-sol">Program solicitation</label>' +
          '  <textarea id="g-sol" rows="5" placeholder="Paste FOA / BAA / RFP language…"></textarea>' +
          '</div>' +
          '<div class="field">' +
          '  <label for="g-out">Target outcome</label>' +
          '  <textarea id="g-out" rows="4" placeholder="State the operational outcome you intend to engineer…"></textarea>' +
          '</div>' +
          '<div class="field" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 22px;">' +
          '  <div class="kicker" style="margin: 0;">Synthesized review</div>' +
          '  <button id="g-synth" class="btn-primary" type="button">Synthesize</button>' +
          '</div>' +
          '<div id="g-output" class="field"></div>' +
          '<div id="g-review" class="field"></div>';

      function runSynthesis(s) {
        const sol = qs('#g-sol', s).value.trim();
        const out = qs('#g-out', s).value.trim();
        const target = qs('#g-output', s);
        const reviewEl = qs('#g-review', s);
        if (!sol || !out) {
          target.innerHTML =
            '<div class="mono" style="font-size: 12px; color: #b89a1f;">' +
            'Parameters incomplete — provide solicitation and outcome.' +
            '</div>';
          return;
        }
        const id = signedHash('grant', sol + '|' + out);
        const lines = [
          '↳ Deconstructing solicitation (' + sol.length + ' chars)',
          '↳ Projecting outcome vector onto program axes',
          '↳ Stress-testing narrative for adversarial review',
          '↳ Manifest ready · REF ' + id,
        ];
        target.innerHTML = '<div class="mono" style="font-size: 12.5px; color: rgba(230,230,230,0.78);"></div>';
        const tickerEl = target.firstChild;
        let i = 0;
        const next = () => {
          if (i >= lines.length) {
            Log.push('EXEC', 'GRANT_LOGIC synthesized · ' + id);
            const params = computeStressParams(sol, out, id);
            const review = composeReview(sol, out, id, params);
            renderReviewPanel(reviewEl, sol, out, id, params, review);
            return;
          }
          const ln = ce('div');
          ln.textContent = lines[i++];
          tickerEl.appendChild(ln);
          setTimeout(next, 320);
        };
        next();
      }

      // Deterministic stress parameters — same approach as before.
      function computeStressParams(sol, out, id) {
        const keywords = sol.split(/\W+/)
          .filter((w) => w.length > 5).slice(0, 4)
          .map((w) => w.toUpperCase()).filter(Boolean);
        const alignPct  = 50 + (id.charCodeAt(0) % 40);
        const coherence = 85 + (id.charCodeAt(2) % 13);
        const riskLabels = ['LOW', 'MODERATE', 'ELEVATED'];
        const risk = riskLabels[id.charCodeAt(1) % 3];
        return {
          alignment: alignPct,
          coherence,
          risk,
          axes: keywords,
          ref: id,
        };
      }

      // Deterministic agentic review — bullets + outline + draft body.
      function composeReview(sol, out, id, p) {
        const sentences = (sol.match(/[^.!?]+[.!?]+/g) || [sol])
          .map((x) => x.trim()).filter(Boolean);
        const lead = (sentences[0] || sol).slice(0, 220);
        const axesStr = p.axes.length ? p.axes.slice(0, 3).join(' · ') : 'PROGRAM AXES';
        const reviewerNotes = [
          'Solicitation lead: "' + lead + (lead.length >= 220 ? '…' : '') + '"',
          'Alignment to program axes is ' + p.alignment + '%; widen evidence around ' + axesStr + ' to lift this above 80%.',
          'Narrative coherence ' + p.coherence + '% — strong; preserve the through-line from problem → approach → evaluation.',
          'Adversarial-review risk flag: ' + p.risk + '. ' +
            (p.risk === 'LOW' ? 'No structural exposure detected.'
              : p.risk === 'MODERATE' ? 'Address one likely-reviewer objection in the approach section.'
              : 'Add an explicit risk & mitigation paragraph; reviewers will probe this.'),
          'Provenance ref ' + id + ' will travel on the email; quote it in any follow-up correspondence.',
        ];
        const outline = [
          'Objectives — restate the operational outcome in one paragraph; map each clause to a solicitation axis.',
          'Approach — three concrete work-streams; cite prior art and substrate (' + axesStr + ').',
          'Evaluation — define one quantitative success metric per work-stream and the data needed to compute it.',
          'Risk & mitigation — name the top adversarial-review concern and how the plan absorbs it.',
        ];
        const draft =
          'Subject: response to the program solicitation; target outcome described below.\n\n' +
          '1. Target outcome\n' + out + '\n\n' +
          '2. Alignment to solicitation\n' +
          'The proposed effort maps onto the solicitation along ' + axesStr + '. ' +
          'Synthesized alignment is ' + p.alignment + '%; coherence ' + p.coherence + '%; ' +
          'adversarial-review risk: ' + p.risk + '.\n\n' +
          '3. Approach\n' +
          '- Objectives: ' + outline[0] + '\n' +
          '- Method:     ' + outline[1] + '\n' +
          '- Evaluation: ' + outline[2] + '\n' +
          '- Risk:       ' + outline[3] + '\n\n' +
          '4. Reviewer notes (synthesized)\n' +
          reviewerNotes.map((n, i) => '  ' + (i + 1) + '. ' + n).join('\n') + '\n\n' +
          'Provenance · REF ' + id + '\n' +
          '— Generated by DaScient Concierge.';
        return { reviewerNotes, outline, draft };
      }

          const body = buildEmailBody(host, ctx);

            }, () => fallbackCopy(body, host));

          sendViaMailto(host, ctx);
        });
        const serverBtn = qs('#g-send-server', host);

      function startCooling(ctx) {
        if (ctx.timer) clearInterval(ctx.timer);
        if (ctx.cooling <= 0) {
          ctx.remaining = 0;
          updateCoolingUI(ctx);
          return;
        }
        ctx.timer = setInterval(() => {
          ctx.remaining = Math.max(0, ctx.remaining - 1);
          updateCoolingUI(ctx);
          if (ctx.remaining <= 0) {
            clearInterval(ctx.timer);
            ctx.timer = null;
            Log.push('EXEC', 'GRANT_LOGIC review window unlocked · REF ' + ctx.id);
          }
        }, 1000);
        updateCoolingUI(ctx);
      }
      function resetCooling(ctx) {
        ctx.remaining = ctx.cooling;
        startCooling(ctx);
      }
      function updateCoolingUI(ctx) {
        const fill = qs('#g-cooling-fill', ctx.host);
        const label = qs('#g-cooling-label', ctx.host);
        const send = qs('#g-send', ctx.host);
        const sendServer = qs('#g-send-server', ctx.host);
        const pct = ctx.cooling > 0 ? Math.round((ctx.remaining / ctx.cooling) * 100) : 0;
        if (fill) fill.style.width = pct + '%';
        const m = Math.floor(ctx.remaining / 60);
        const sec = ctx.remaining % 60;
        const fmt = m + ':' + (sec < 10 ? '0' + sec : sec);
        if (label) {
          label.textContent = ctx.remaining > 0
            ? '[ REVIEWING · ' + fmt + ' ]'
            : '[ REVIEW WINDOW COMPLETE — submission channel unlocked ]';
        }
        if (send) {
          send.disabled = ctx.remaining > 0;
          if (ctx.remaining > 0) {
            send.textContent = '[ REVIEWING · ' + fmt + ' ]';
          } else {
            send.textContent = 'Send to ' + (ctx.ho.email || 'grants@dascient.com');
          }
        }
        if (sendServer) {
          sendServer.disabled = ctx.remaining > 0;
        }
      }

      function buildEmailBody(host, ctx) {
        const cover = qs('#g-cover', host).value.trim();
        const draft = qs('#g-draft', host).value;
        const params = [
          '── Solicitation axis alignment · ' + ctx.p.alignment + '%',
          '── Narrative coherence · ' + ctx.p.coherence + '%',
          '── Adversarial risk flag · ' + ctx.p.risk,
          (ctx.p.axes.length ? '── Key axes · ' + ctx.p.axes.join(' · ') : ''),
          '── REF ' + ctx.id,
        ].filter(Boolean).join('\n');
        const footer =
          '\n\n— Generated by DaScient Concierge · do not reply to this address before review. REF ' + ctx.id;
        return (cover ? cover + '\n\n' : '') + draft + '\n\n— Stress parameters —\n' + params + footer;
      }

      function sendViaMailto(host, ctx) {
        const subjectVal = qs('#g-subject', host).value.trim() ||
          ((ctx.ho.subject || 'DaScient') + ' · REF ' + ctx.id);
        const fullBody = buildEmailBody(host, ctx);
        // mailto bodies are clipped at ~2000 chars in most clients; keep some
        // headroom for the URL itself and trailing %0D%0A pairs.
        const MAX = 1900;
        let bodyForMailto = fullBody;
        let truncated = false;
        if (bodyForMailto.length > MAX) {
          bodyForMailto = bodyForMailto.slice(0, MAX - 80) +
            '\n\n[…truncated for mail client. Use "Copy full draft" to paste the complete version. REF ' + ctx.id + ']';
          truncated = true;
        }
        // Encode line breaks as %0D%0A per RFC; encodeURIComponent handles the rest.
        const encoded = encodeURIComponent(bodyForMailto).replace(/%0A/g, '%0D%0A');
        const href = 'mailto:' + (ctx.ho.email || 'grants@dascient.com') +
          '?subject=' + encodeURIComponent(subjectVal) +
          '&body=' + encoded;
        // Use a transient anchor so we don't trigger a navigation in the SPA.
        const a = document.createElement('a');
        a.href = href;
        a.rel = 'noopener';
        document.body.appendChild(a);
        a.click();
        a.remove();
        Log.push('EXEC', 'HANDOFF · VECTOR_A -> ' + (ctx.ho.email || 'grants@dascient.com') + ' · REF ' + ctx.id);
        const status = qs('#g-send-status', host);
        status.textContent = truncated
          ? 'Mail client opened with a truncated draft. Use "Copy full draft" to paste the complete version into the email body.'
          : 'Mail client opened with the synthesized draft.';
      }

      async function sendViaWorker(host, ctx) {
        const endpoint = ctx.ho.send_endpoint;
        if (!endpoint) return;
        const status = qs('#g-send-status', host);
        const subjectVal = qs('#g-subject', host).value.trim() ||
          ((ctx.ho.subject || 'DaScient') + ' · REF ' + ctx.id);
        const body = buildEmailBody(host, ctx);
        status.textContent = 'Sending via DaScient…';
        try {
          const resp = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              subject: subjectVal,
              body,
              ref: ctx.id,
              to: ctx.ho.email || 'grants@dascient.com',
            }),
          });
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          const json = await resp.json().catch(() => ({}));
          status.textContent = 'Submitted via DaScient · REF ' + (json.ref || ctx.id);
          Log.push('EXEC', 'HANDOFF · server-send OK · REF ' + (json.ref || ctx.id));
        } catch (e) {
          status.textContent = 'Server-send failed (' + e.message + '). You can still use the mail client button.';
          Log.push('WARN', 'server-send failed: ' + e.message);
        }
      }

      function fallbackCopy(text, host) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'absolute';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); }
        catch (_) { /* */ }
        ta.remove();
        const status = qs('#g-send-status', host);
        if (status) status.textContent = 'Full draft copied to clipboard.';
      }

      // ============================================================
      // Architect Dialogue (Model Orchestration Layer)
      // Logic preserved verbatim from prior build; render layer simplified.
      // ============================================================
      const Orchestrator = {
        vectorById(id) {
          const o = State.manifest && State.manifest.orchestration;
          if (!o) return null;
          return o.vectors.find((v) => v.id === id) || null;
        },
        route(text) {
          const o = State.manifest.orchestration;
          const t = text.toLowerCase();
          let best = { id: null, score: 0 };
          for (const v of o.vectors) {
            let score = 0;
            for (const k of v.keywords) {
              if (t.includes(k)) score += k.length >= 5 ? 2 : 1;
            }
            if (score > best.score) best = { id: v.id, score };
          }
          return best.id || 'B';
        },
        setVector(vectorId, opts) {
          opts = opts || {};
          const v = this.vectorById(vectorId);
          if (!v) return;
          if (State.orchestration.currentVector === v.code && !opts.force) return;
          const router = State.manifest.orchestration.router;
          State.orchestration.currentVector = v.code;
          State.orchestration.currentModel = v.model;
          State.orchestration.progress = 0;
          State.orchestration.handoffShown = false;
          State.memory.dialogue.vector = v.id;
          persistMemory();
          Log.push('SWITCH', '-> Intent Detected: ' + v.code +
            '. Loading ' + v.model + ' (' + v.mode + ')...');
          Log.push('MEM', '-> Context transferred to Specialist Engine via ' + router.name + '.');
          renderCurrentSpecialist();
        },
        setProgress(pct, ctx) {
          const clamped = Math.max(0, Math.min(100, Math.round(pct)));
          const prev = State.orchestration.progress;
          State.orchestration.progress = clamped;
          const meter = qs('#arch-meter-fill');
          if (meter) meter.style.width = clamped + '%';
          const label = qs('#arch-meter-label');
          if (label) label.textContent = clamped + '%';
          if (prev < 85 && clamped >= 85) {
            Log.push('ALERT', '-> Conversion Threshold: ' + clamped +
              '% reached. Displaying Human Hand-off...' + (ctx ? ' [' + ctx + ']' : ''));
          }
        },
      };

      function specialistRunA(vector, userText, threadEl) {

      function specialistRunC(vector, userText, threadEl) {
        const r = State.memory.dialogue.recruitment;
        if (!r.completed && r.step < vector.questions.length) {
          const q = vector.questions[r.step];
          r.answers.push({ id: q.id, label: q.label, answer: userText });
          r.step += 1;
          if (r.step >= vector.questions.length) r.completed = true;
          persistMemory();
        }
        const total = vector.questions.length;
        const pct = Math.round((r.step / total) * 100);
        Orchestrator.setProgress(pct, 'interview ' + r.step + '/' + total);

        if (r.completed) {
          const lines = [
            '↳ Intake captured · ' + total + '/' + total + ' responses recorded',
            '↳ Provenance locked · signed-hash ' + signedHash('intake', JSON.stringify(r.answers)),
            '↳ Initiating team handoff',
          ];
          return streamSpecialistLines(threadEl, vector, lines, [pct, pct, 100]);
        }
        const next = vector.questions[r.step];
        const lines = [
          'Question ' + (r.step + 1) + ' / ' + total + ' · ' + next.label,
          next.prompt,

        return streamSpecialistLines(threadEl, vector, lines, [pct, pct]);

      function streamSpecialistLines(threadEl, vector, lines, progressSteps) {
        const bubble = ce('div', 'arch-msg-spec');

          '<div class="mono" style="font-size: 10px; letter-spacing: 0.18em; color: rgba(230,230,230,0.55); text-transform: uppercase;">' +
          escapeHtml(vector.model) + ' · ' + escapeHtml(vector.role) +

          '<div class="body" style="margin-top: 6px;"></div>';
        threadEl.appendChild(bubble);
        threadEl.scrollTop = threadEl.scrollHeight;
        const target = bubble.querySelector('.body');
        return new Promise((resolve) => {
          let i = 0;
          const next = () => {
            if (i >= lines.length) return resolve();
            if (progressSteps && typeof progressSteps[i] === 'number') {
              Orchestrator.setProgress(progressSteps[i], vector.code);
            }
            const ln = ce('div');
            ln.textContent = lines[i++];
            target.appendChild(ln);
            threadEl.scrollTop = threadEl.scrollHeight;
            setTimeout(next, 320);
          };
          next();
        });

      async function specialistRunWebLLM(vector, userText, threadEl) {
        const eng = State.orchestration.webllm.engine;
        if (!eng) return null;
        const bubble = ce('div', 'arch-msg-spec');
        bubble.innerHTML =
          '<div class="mono" style="font-size: 10px; letter-spacing: 0.18em; color: rgba(230,230,230,0.55); text-transform: uppercase;">' +
          escapeHtml(vector.model) + ' · ' + escapeHtml(vector.role) + ' · LIVE</div>' +
          '<div class="body" style="margin-top: 6px;"></div>';
        threadEl.appendChild(bubble);
        const target = bubble.querySelector('.body');
        try {
          Orchestrator.setProgress(40, 'webllm');
          const sys = 'You are ' + vector.role + ' for DaScient (' + vector.label +
            '). Respond with deterministic, high-signal, in-voice prose. Be concise. ' +
            'No preamble. Use mono-style step markers (↳) where appropriate.';
          const messages = [{ role: 'system', content: sys }, { role: 'user', content: userText }];
          const stream = await eng.chat.completions.create({ messages, stream: true });
          let acc = '';
          for await (const chunk of stream) {
            const delta = chunk?.choices?.[0]?.delta?.content || '';
            if (!delta) continue;
            acc += delta;
            target.textContent = acc;
            threadEl.scrollTop = threadEl.scrollHeight;
          }
          Orchestrator.setProgress(95, 'webllm');
          return acc;
        } catch (e) {
          Log.push('WARN', 'WebLLM stream failed — falling back');
          bubble.remove();
          return null;
        }
      }

      // OpenAI streaming. Prefers the Cloudflare Worker proxy when configured
      // (manifest.orchestration.proxy_endpoint); otherwise falls back to the
      // direct API call using the build-time injected key.
      async function specialistRunOpenAI(vector, userText, threadEl) {
        const proxy = State.manifest.orchestration && State.manifest.orchestration.proxy_endpoint;
        if (!proxy && !OPENAI_API_KEY) return null;
        const bubble = ce('div', 'arch-msg-spec');
        bubble.innerHTML =
          '<div class="mono" style="font-size: 10px; letter-spacing: 0.18em; color: rgba(230,230,230,0.55); text-transform: uppercase;">' +
          escapeHtml(vector.model) + ' · ' + escapeHtml(vector.role) +
          ' · LIVE · ' + (proxy ? 'PROXY' : 'OPENAI') + '</div>' +
          '<div class="body" style="margin-top: 6px;"></div>';
        threadEl.appendChild(bubble);
        const target = bubble.querySelector('.body');
        try {
          Orchestrator.setProgress(40, proxy ? 'proxy' : 'openai');
          const sys = 'You are ' + vector.role + ' for DaScient (' + vector.label +
            '). Respond with deterministic, high-signal, in-voice prose. Be concise. ' +
            'No preamble. Use mono-style step markers (↳) where appropriate.';
          const messages = [{ role: 'system', content: sys }, { role: 'user', content: userText }];
          const headers = { 'Content-Type': 'application/json' };
          let url;
          let body;
          if (proxy) {
            url = proxy;
            body = JSON.stringify({ model: OPENAI_MODEL, messages, stream: true });
          } else {
            url = 'https://api.openai.com/v1/chat/completions';
            headers['Authorization'] = 'Bearer ' + OPENAI_API_KEY;
            body = JSON.stringify({ model: OPENAI_MODEL, messages, stream: true });
          }
          const resp = await fetch(url, { method: 'POST', headers, body });
          if (!resp.ok || !resp.body) throw new Error('http ' + resp.status);
          const reader = resp.body.getReader();
          const decoder = new TextDecoder();
          let buf = '';
          let acc = '';
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });
            let idx;
            while ((idx = buf.indexOf('\n')) >= 0) {
              const line = buf.slice(0, idx).trim();
              buf = buf.slice(idx + 1);
              if (!line.startsWith('data:')) continue;
              const payload = line.slice(5).trim();
              if (payload === '[DONE]') { buf = ''; break; }
              try {
                const json = JSON.parse(payload);
                const delta = json?.choices?.[0]?.delta?.content || '';
                if (delta) {
                  acc += delta;
                  target.textContent = acc;
                  threadEl.scrollTop = threadEl.scrollHeight;
                }
              } catch (_) { /* tolerate partials */ }
            }
          }
          Orchestrator.setProgress(95, proxy ? 'proxy' : 'openai');
          return acc || null;
        } catch (e) {
          Log.push('WARN', 'OpenAI stream failed — falling back to deterministic');
          bubble.remove();
          return null;
        }
      }

      function evaluateThreshold(vector, userText) {
        const th = vector.threshold || {};
        if (th.type === 'synthesis_complete') return State.orchestration.progress >= 100;
        if (th.type === 'keyword_trigger') {
          const t = (userText || '').toLowerCase();
          return (th.words || []).some((w) => t.includes(w));
        }
        if (th.type === 'interview_complete') return !!(State.memory.dialogue.recruitment.completed);
        return false;
      }

      async function engageWebLLM(vector, btn) {
        const w = State.orchestration.webllm;
        if (w.loading) return;
        if (!('gpu' in navigator)) {
          Log.push('WARN', 'WebGPU unavailable — staying in deterministic mode');
          if (btn) btn.textContent = 'WebGPU unavailable';
          return;
        }
        w.loading = true;
        if (btn) btn.textContent = 'Loading ' + vector.model + '…';
        Log.push('MEM', 'engaging WebLLM · ' + vector.engine);
        try {
          const mod = await import('https://esm.run/@mlc-ai/web-llm');
          const engine = await mod.CreateMLCEngine(vector.engine, {
            initProgressCallback: (p) => {
              const pct = Math.round((p && typeof p.progress === 'number' ? p.progress : 0) * 100);
              if (btn) btn.textContent = 'Loading · ' + pct + '%';
              if (pct % 10 === 0) Log.push('MEM', vector.engine + ' · ' + pct + '%');
            },
          });
          w.engine = engine;
          w.engaged = true;
          w.modelId = vector.engine;
          if (btn) btn.textContent = 'WebLLM engaged';
          Log.push('SWITCH', '-> Live engine ready: ' + vector.model);
        } catch (e) {
          Log.push('WARN', 'WebLLM engagement failed — deterministic only');
          if (btn) btn.textContent = 'WebLLM unavailable';
        } finally {
          w.loading = false;
        }
      }

      function appendMessage(threadEl, role, text, modelLabel) {

      async function dispatchUserTurn(text, threadEl) {
        State.memory.dialogue.history.push({ role: 'user', text });
        if (State.memory.dialogue.history.length > 40) {
          State.memory.dialogue.history = State.memory.dialogue.history.slice(-40);
        }
        persistMemory();
        appendMessage(threadEl, 'user', text);

        const vectorId = Orchestrator.route(text);
        const vector = Orchestrator.vectorById(vectorId);
        Orchestrator.setVector(vectorId);
        renderCurrentSpecialist();

        const earlyTrigger =
          vector.threshold && vector.threshold.type === 'keyword_trigger' &&
          evaluateThreshold(vector, text);

        let liveOutput = null;
        if (State.orchestration.webllm.engaged && State.orchestration.webllm.engine) {
          liveOutput = await specialistRunWebLLM(vector, text, threadEl);
        }
        if (liveOutput == null) {
          // OpenAI path attempted whenever a proxy_endpoint is configured OR a
          // build-time key is present; specialistRunOpenAI returns null if neither.
          liveOutput = await specialistRunOpenAI(vector, text, threadEl);
        }
        if (liveOutput == null) {
          if (vector.id === 'A') await specialistRunA(vector, text, threadEl);
          else if (vector.id === 'B') await specialistRunB(vector, text, threadEl);
          else await specialistRunC(vector, text, threadEl);
        }

        State.memory.dialogue.history.push({
          role: 'specialist',
          text: '[' + vector.code + ' synthesis]',
          modelLabel: vector.model + ' · ' + vector.role.toUpperCase(),
        });
        persistMemory();

        if (earlyTrigger || evaluateThreshold(vector, text)) {
          Orchestrator.setProgress(100, vector.code);
          setTimeout(() => triggerHandoff(vector), 320);
        }
      }
